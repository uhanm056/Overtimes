<!doctype html>
<html lang="cs" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Přesčasový panel Planá</title>
<meta name="description" content="Přehled přesčasových hodin podle středisek — závod Planá.">
<meta name="color-scheme" content="light dark">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Přesčasový panel Planá — vzhled.
   Tmavý boční rail + světlý/tmavý obsah. Barvy jsou tokeny v :root,
   tmavý režim se přebírá z prefers-color-scheme a přebíjí přepínačem [data-theme]. */

/* ---------- tokeny: světlý režim ---------- */
:root {
  color-scheme: light;

  --bg: #f4f6f6;
  --surface: #ffffff;
  --surface-2: #eef1f1;
  --surface-3: #e3e8e8;
  --line: #d9e0df;
  --line-soft: #e8eded;

  --text: #14201f;
  --text-2: #4d5f5d;
  --text-3: #7a8b89;

  --accent: #0f9e91;
  --accent-2: #25c9b6;
  --accent-soft: #e0f4f1;
  --on-accent: #ffffff;

  --warn: #c07f00;
  --warn-soft: #fbf0d8;
  --crit: #d24842;
  --crit-soft: #fbe4e3;
  --good: #1a9963;
  --good-soft: #ddf3e8;

  --rail-bg: #0e1a1c;
  --rail-bg-2: #16292b;
  --rail-text: #d7e4e3;
  --rail-text-2: #7f9997;
  --rail-line: #23393b;

  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 1px 2px rgba(16, 33, 32, .06), 0 8px 24px -14px rgba(16, 33, 32, .28);

  --font-display: 'Bricolage Grotesque', 'Figtree', system-ui, sans-serif;
  --font-text: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}

/* ---------- tokeny: tmavý režim ---------- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    color-scheme: dark;

    --bg: #0f1718;
    --surface: #162224;
    --surface-2: #1c2b2d;
    --surface-3: #24373a;
    --line: #2a3f42;
    --line-soft: #223336;

    --text: #e7f0ef;
    --text-2: #a3b7b5;
    --text-3: #7a908e;

    --accent: #25c9b6;
    --accent-2: #4fe0cf;
    --accent-soft: #16383a;
    --on-accent: #04211f;

    --warn: #e0a52a;
    --warn-soft: #3a2f11;
    --crit: #f0716a;
    --crit-soft: #3d1f1e;
    --good: #3fc98a;
    --good-soft: #12352a;

    --rail-bg: #0a1314;
    --rail-bg-2: #12211f;
    --rail-line: #1e3134;

    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -16px rgba(0, 0, 0, .7);
  }
}

:root[data-theme='dark'] {
  color-scheme: dark;

  --bg: #0f1718;
  --surface: #162224;
  --surface-2: #1c2b2d;
  --surface-3: #24373a;
  --line: #2a3f42;
  --line-soft: #223336;

  --text: #e7f0ef;
  --text-2: #a3b7b5;
  --text-3: #7a908e;

  --accent: #25c9b6;
  --accent-2: #4fe0cf;
  --accent-soft: #16383a;
  --on-accent: #04211f;

  --warn: #e0a52a;
  --warn-soft: #3a2f11;
  --crit: #f0716a;
  --crit-soft: #3d1f1e;
  --good: #3fc98a;
  --good-soft: #12352a;

  --rail-bg: #0a1314;
  --rail-bg-2: #12211f;
  --rail-line: #1e3134;

  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -16px rgba(0, 0, 0, .7);
}

/* ---------- základ ---------- */
* { box-sizing: border-box; }

/* vlastní display: flex na .demo-banner by přebil výchozí pravidlo prohlížeče */
[hidden] { display: none !important; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-text);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 {
  font-family: var(--font-display);
  font-weight: 600;
  letter-spacing: -.015em;
  margin: 0;
}

a { color: var(--accent); }

.num, td.num, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.visually-hidden {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}

/* ---------- rozvržení ---------- */
.shell { display: flex; min-height: 100vh; }

.rail {
  flex: 0 0 236px;
  background: linear-gradient(180deg, var(--rail-bg-2), var(--rail-bg));
  color: var(--rail-text);
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 22px 16px;
  position: sticky;
  top: 0;
  height: 100vh;
}

.brand { display: flex; gap: 11px; align-items: center; padding: 0 6px; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 10px; flex: none;
  background: linear-gradient(140deg, var(--accent-2), var(--accent));
  color: #04211f;
  display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700; font-size: 15px;
}
.brand-name { font-family: var(--font-display); font-weight: 600; font-size: 15px; line-height: 1.15; }
.brand-sub { color: var(--rail-text-2); font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; }

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button {
  appearance: none; border: 0; background: transparent; cursor: pointer;
  color: var(--rail-text); font: inherit; text-align: left;
  display: flex; align-items: center; gap: 10px;
  padding: 9px 11px; border-radius: var(--radius-sm);
  transition: background .13s ease, color .13s ease;
}
.nav button:hover { background: rgba(255, 255, 255, .06); }
.nav button[aria-current='true'] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.nav button[aria-current='true'] .nav-icon { opacity: 1; }
.nav-icon { width: 17px; height: 17px; flex: none; opacity: .72; }

.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.rail-note { color: var(--rail-text-2); font-size: 11.5px; line-height: 1.45; padding: 0 6px; }

.theme-toggle {
  appearance: none; cursor: pointer; font: inherit;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 9px 11px; border-radius: var(--radius-sm);
  background: rgba(255, 255, 255, .05); border: 1px solid var(--rail-line);
  color: var(--rail-text);
}
.theme-toggle:hover { background: rgba(255, 255, 255, .1); }

.main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: flex-end;
  justify-content: space-between;
  padding: 26px 32px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--bg);
  position: sticky; top: 0; z-index: 5;
}
.topbar h1 { font-size: 25px; }
.topbar .sub { color: var(--text-2); font-size: 13.5px; margin-top: 3px; }

.month-picker { display: flex; align-items: center; gap: 9px; }
.month-picker label { color: var(--text-2); font-size: 13px; }
select, input[type='search'], input[type='text'] {
  font: inherit; color: var(--text);
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 8px 11px;
}
select:focus-visible, input:focus-visible, button:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

.content { padding: 24px 32px 56px; }
.panel[hidden] { display: none !important; }

/* ---------- upozornění na ukázková data ---------- */
.demo-banner {
  display: flex; gap: 10px; align-items: flex-start;
  margin: 0 32px 0; padding: 11px 14px;
  border: 1px dashed var(--warn); border-radius: var(--radius);
  background: var(--warn-soft); color: var(--text);
  font-size: 13.5px;
}
.demo-banner strong { font-weight: 700; }

.method-banner {
  display: flex; gap: 10px; align-items: flex-start;
  margin: 10px 32px 0; padding: 11px 14px;
  border: 1px solid var(--accent); border-radius: var(--radius);
  background: var(--accent-soft); color: var(--text);
  font-size: 13px; line-height: 1.65;
}
.method-banner strong { font-weight: 700; }
.method-banner .btn { margin-left: 2px; vertical-align: baseline; }

/* ---------- karty ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px 20px;
}
/* jen mezi bloky na úrovni sekce — uvnitř .grid rozestupy dělá gap */
.panel > .card + .card,
.panel > .grid + .card,
.panel > .card + .grid,
.panel > .grid + .grid { margin-top: 18px; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
.card-head h2 { font-size: 16.5px; }
.card-head h3 { font-size: 15px; }
.card-head .hint, .hint { color: var(--text-3); font-size: 12.5px; }

.grid { display: grid; gap: 18px; }
.grid.kpis { grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); align-items: start; }

/* ---------- KPI ---------- */
.kpi { display: flex; flex-direction: column; gap: 5px; }
.kpi .label { color: var(--text-2); font-size: 12.5px; letter-spacing: .01em; }
.kpi .value {
  font-family: var(--font-mono); font-size: 23px; font-weight: 600;
  letter-spacing: -.03em; line-height: 1.15; font-variant-numeric: tabular-nums;
}
.kpi .foot { color: var(--text-3); font-size: 11.5px; line-height: 1.4; }
.kpi.warn .value { color: var(--warn); }
.kpi.crit .value { color: var(--crit); }
.kpi.good .value { color: var(--good); }

/* ---------- pruhové grafy ---------- */
.bars { display: flex; flex-direction: column; gap: 9px; }
.bar-row { display: grid; grid-template-columns: minmax(96px, 168px) 1fr auto; gap: 12px; align-items: center; }
.bar-row .name { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { background: var(--surface-2); border-radius: 999px; height: 11px; overflow: hidden; }
.bar-fill { display: block; height: 100%; border-radius: 999px; background: var(--accent); transition: width .35s ease; }
.bar-fill.warn { background: var(--warn); }
.bar-fill.crit { background: var(--crit); }
.bar-row .val { font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; min-width: 74px; text-align: right; }
.bar-row .val small { color: var(--text-3); }

/* histogram */
.hist { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; align-items: end; height: 168px; }
.hist-col { display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; height: 100%; text-align: center; }
.hist-bar { background: var(--accent); border-radius: 6px 6px 2px 2px; min-height: 3px; transition: height .35s ease; }
.hist-bar.warn { background: var(--warn); }
.hist-bar.crit { background: var(--crit); }
.hist-col .n { font-family: var(--font-mono); font-size: 12.5px; }
.hist-col .lbl { color: var(--text-3); font-size: 11.5px; }

/* rozpad MEZD / evidence */
.split { display: flex; height: 26px; border-radius: 8px; overflow: hidden; background: var(--surface-2); }
.split span { display: block; }
.split .paid { background: var(--accent); }
.split .konto { background: var(--accent-2); opacity: .5; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 12px; font-size: 13px; color: var(--text-2); }
.legend .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 7px; vertical-align: -1px; }

/* ---------- tabulky ---------- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
th {
  color: var(--text-2); font-weight: 600; font-size: 12.5px;
  position: sticky; top: 0; background: var(--surface);
}
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--text); }
th[aria-sort='ascending']::after { content: ' ▲'; font-size: 9px; }
th[aria-sort='descending']::after { content: ' ▼'; font-size: 9px; }
td.num, th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
tbody tr:hover { background: var(--surface-2); }
td.name { white-space: normal; min-width: 190px; }
.rank { color: var(--text-3); font-family: var(--font-mono); width: 34px; }
mark { background: var(--accent-soft); color: inherit; border-radius: 3px; padding: 0 2px; }

/* ---------- odznaky ---------- */
.tag {
  display: inline-block; padding: 1px 8px; border-radius: 999px;
  font-size: 11.5px; font-weight: 600; letter-spacing: .01em;
  background: var(--surface-3); color: var(--text-2);
}
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.crit { background: var(--crit-soft); color: var(--crit); }
.tag.good { background: var(--good-soft); color: var(--good); }
.tag.accent { background: var(--accent-soft); color: var(--accent); }

/* ---------- chipy středisek ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  appearance: none; cursor: pointer; font: inherit; font-size: 13px;
  border: 1px solid var(--line); background: var(--surface);
  color: var(--text); border-radius: 999px; padding: 6px 13px;
  display: inline-flex; align-items: center; gap: 8px;
  transition: border-color .13s ease, background .13s ease;
}
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed='true'] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip .c-avg { font-family: var(--font-mono); font-size: 12px; opacity: .8; }
.chip.warn:not([aria-pressed='true']) { border-color: var(--warn); }
.chip.crit:not([aria-pressed='true']) { border-color: var(--crit); }

/* ---------- lišta nástrojů a export ---------- */
.topbar-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.export-status { font-size: 12.5px; color: var(--text-3); max-width: 240px; }
.export-status.ok { color: var(--good); }
.export-status.err { color: var(--crit); }
#export-btn[disabled] { opacity: .6; cursor: progress; }

/* ---------- grafy vývoje ---------- */
.metric-switch { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.chart-host { position: relative; width: 100%; }
.chart { display: block; width: 100%; height: auto; overflow: visible; }

.chart-grid { stroke: var(--line-soft); stroke-width: 1; }
.chart-axis { stroke: var(--line); stroke-width: 1; }
.chart-tick { fill: var(--text-3); font-size: 11.5px; font-family: var(--font-mono); }
.chart-line { stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
/* prstenec v barvě povrchu odděluje body tam, kde se čáry kříží */
.chart-dot { stroke: var(--surface); stroke-width: 2; }
.chart-end { font-size: 11.5px; font-weight: 600; font-family: var(--font-text); }
.chart-ref { stroke: var(--text-3); stroke-width: 1; stroke-dasharray: 5 4; opacity: .6; }
.chart-ref.warn { stroke: var(--warn); opacity: .8; }
.chart-ref.crit { stroke: var(--crit); opacity: .8; }
.chart-ref-label { font-size: 10.5px; fill: var(--text-3); font-family: var(--font-text); }
.chart-ref-label.warn { fill: var(--warn); }
.chart-ref-label.crit { fill: var(--crit); }

.chart-cross { stroke: var(--text-3); stroke-width: 1; stroke-dasharray: 3 3; pointer-events: none; }

.chart-tip {
  position: absolute; top: 6px; transform: translateX(-50%);
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-sm); box-shadow: var(--shadow);
  padding: 8px 11px; font-size: 12.5px; pointer-events: none; z-index: 2;
  min-width: 128px;
}
.chart-tip strong { display: block; margin-bottom: 5px; font-family: var(--font-display); }
.chart-tip .row { display: flex; align-items: center; gap: 7px; margin-top: 3px; }
.chart-tip .row i { width: 9px; height: 9px; border-radius: 2px; flex: none; }
.chart-tip .nm { color: var(--text-2); }
.chart-legend { margin-top: 14px; }

.chart-tip .vl { margin-left: auto; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ---------- TOP střediska a jejich lidé ---------- */
.topc { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px 26px; }
.topc-item { min-width: 0; }
.topc-head { display: flex; align-items: baseline; gap: 9px; }
.topc-rank { color: var(--text-3); font-family: var(--font-mono); font-size: 13px; }
.topc-name { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topc-nums { margin-left: auto; text-align: right; flex: none; }
.topc-nums strong { display: block; font-family: var(--font-mono); font-size: 14px; font-variant-numeric: tabular-nums; }
.topc-nums small { color: var(--text-3); font-size: 11.5px; }

.topc-bar { height: 6px; border-radius: 999px; background: var(--surface-2); margin: 7px 0 10px; overflow: hidden; }
.topc-bar span { display: block; height: 100%; border-radius: 999px; background: var(--accent); }

.topc-people { list-style: none; margin: 0; padding: 0; }
.topc-people li {
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  padding: 5px 0; border-bottom: 1px solid var(--line-soft); font-size: 13.5px;
}
.topc-people li.more { color: var(--text-3); font-size: 12.5px; border-bottom: 0; padding-top: 7px; }
.topc-people .amt { font-family: var(--font-mono); font-variant-numeric: tabular-nums; flex: none; }

/* ---------- vývoj jednoho člověka ---------- */
.person-metric { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 16px; }
.person-hits { list-style: none; margin: 0; padding: 0; }
.person-hits li + li { border-top: 1px solid var(--line-soft); }
.person-hits button {
  appearance: none; border: 0; background: transparent; cursor: pointer;
  font: inherit; color: var(--text); text-align: left; width: 100%;
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  padding: 9px 8px; border-radius: var(--radius-sm);
}
.person-hits button:hover { background: var(--surface-2); }
.person-hits .who { display: flex; flex-direction: column; }
.person-hits .who small { color: var(--text-3); font-size: 11.5px; }

.link-center,
.link-person {
  appearance: none; border: 0; background: transparent; padding: 0;
  font: inherit; color: inherit; cursor: pointer; text-align: left;
  border-bottom: 1px dotted var(--text-3);
}
.link-center:hover,
.link-person:hover { color: var(--accent); border-bottom-color: var(--accent); }
.link-center { font: inherit; font-weight: inherit; }

tr.muted-row td { color: var(--text-3); }

/* ---------- rozpad měsíce na mzdové složky ---------- */
.link-plain {
  appearance: none; border: 0; background: transparent; padding: 0;
  font: inherit; color: inherit; cursor: pointer; text-align: left;
  display: inline-flex; align-items: baseline; gap: 6px;
}
.link-plain:hover { color: var(--accent); }
.link-plain .caret { color: var(--text-3); font-size: 11px; }
.link-plain:hover .caret { color: var(--accent); }

tr.breakdown-row > td { padding: 0 0 14px; background: var(--surface-2); }
.breakdown { padding: 14px 16px 2px; }
.breakdown h4 {
  margin: 0 0 10px; font-size: 12px; font-weight: 600; letter-spacing: .04em;
  text-transform: uppercase; color: var(--text-3);
}
table.mini { width: auto; min-width: min(560px, 100%); font-size: 13px; }
table.mini th, table.mini td { padding: 6px 14px 6px 0; border-bottom: 1px solid var(--line); }
table.mini tfoot td { border-bottom: 0; border-top: 2px solid var(--line); color: var(--text-2); }
.comp-summary { display: block; margin-top: 2px; }

/* ---------- veřejná verze ---------- */
.pub-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.pub-log { margin: 14px 0 0; padding-left: 18px; color: var(--text-2); font-size: 13px; line-height: 1.75; }
.pub-err {
  margin: 14px 0 0; padding: 10px 12px; border-radius: var(--radius-sm);
  background: var(--crit-soft); color: var(--crit); font-size: 13px;
}
.pub-ok {
  margin: 14px 0 0; padding: 10px 14px; border-radius: var(--radius-sm);
  background: var(--good-soft); color: var(--text); font-size: 13px;
}
.pub-ok .pub-log { margin-top: 8px; }
.pub-sub {
  margin: 0 0 4px; font-size: 12px; font-weight: 600; letter-spacing: .04em;
  text-transform: uppercase; color: var(--text-3);
}
h3.pub-sub + p { margin-top: 0; }
.pub-note {
  margin: 0 0 18px; padding: 12px 14px; border-radius: var(--radius-sm);
  background: var(--surface-2); color: var(--text-2); font-size: 13px; line-height: 1.7;
}
.pub-login { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 14px; }
.pub-login label {
  display: flex; flex-direction: column; gap: 5px;
  font-size: 12px; color: var(--text-2);
}
.pub-login input {
  font: inherit; font-size: 13px; padding: 7px 10px; min-width: 200px;
  color: var(--text); background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-sm);
}
.pub-login input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.remote-note {
  margin: 0 0 18px; padding: 9px 14px; border-radius: var(--radius-sm);
  background: var(--surface-2); color: var(--text-3); font-size: 12.5px;
}
.remote-note.warn { background: var(--warn-soft); color: var(--warn); }

/* ---------- která metodika sedí ---------- */
.method-rows { display: grid; gap: 8px; }
.method-row {
  display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between;
  gap: 8px 16px; padding: 11px 14px; border-radius: var(--radius-sm);
  background: var(--surface-2); border: 1px solid transparent;
}
.method-row.win { background: var(--accent-soft); border-color: var(--accent); }
.method-formula { font-size: 13.5px; font-weight: 600; color: var(--text); }
.method-formula small { display: block; font-weight: 400; color: var(--text-3); font-size: 12px; }
.method-score { font-family: var(--font-mono); font-size: 13px; color: var(--text-2); white-space: nowrap; }
.method-row.win .method-score strong { color: var(--accent); }

.method-verdict {
  margin-top: 16px; padding: 13px 15px; border-radius: var(--radius-sm);
  border-left: 3px solid; font-size: 13px; line-height: 1.7;
}
.method-verdict p { margin: 5px 0 0; color: var(--text-2); }
.method-verdict.good { background: var(--good-soft); border-color: var(--good); }
.method-verdict.warn { background: var(--warn-soft); border-color: var(--warn); }
.method-verdict.crit { background: var(--crit-soft); border-color: var(--crit); }

/* oddělit obě cesty publikování */
hr.pub-split { border: 0; border-top: 1px solid var(--line); margin: 22px 0 18px; }

/* ---------- srovnání měsíců ---------- */
.cmp-picker { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.cmp-picker label { display: flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 13px; }
.cmp-arrow { color: var(--accent); font-size: 17px; }

/* ---------- kdo přibyl / vypadl ---------- */
.change-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px; }
.change-title { font-size: 14.5px; display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
.change-cols .hint { margin: 0 0 11px; }
.change-list { list-style: none; margin: 0; padding: 0; }
.change-list li {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  padding: 7px 0; border-bottom: 1px solid var(--line-soft); font-size: 13.5px;
}
.change-list li.more { color: var(--text-3); font-size: 12.5px; border-bottom: 0; }
.change-list .who { display: flex; flex-direction: column; min-width: 0; }
.change-list .who small { color: var(--text-3); font-size: 11.5px; }
.change-list .amt {
  display: flex; flex-direction: column; align-items: flex-end; flex: none;
  font-family: var(--font-mono); font-variant-numeric: tabular-nums;
}
.change-list .amt small { color: var(--text-3); font-size: 11px; font-family: var(--font-text); }

/* ---------- roční limit ---------- */
.limit-row { display: grid; grid-template-columns: 1fr; gap: 5px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
.limit-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.limit-head .who { font-size: 13.5px; }
.limit-head .who small { color: var(--text-3); }
.limit-head .amt { font-family: var(--font-mono); font-size: 13.5px; }
.limit-track { position: relative; height: 9px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.limit-fill { display: block; height: 100%; border-radius: 999px; background: var(--good); }
.limit-fill.warn { background: var(--warn); }
.limit-fill.crit { background: var(--crit); }

/* ---------- import: přepínač ---------- */
.switch {
  display: flex; align-items: flex-start; gap: 11px; cursor: pointer;
  padding: 12px 14px; margin-bottom: 16px;
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--surface-2);
}
.switch:hover { border-color: var(--accent); }
.switch.off { cursor: not-allowed; opacity: .65; }
.switch.off:hover { border-color: var(--line); }
.switch input { margin: 2px 0 0; width: 16px; height: 16px; accent-color: var(--accent); flex: none; }
.switch span { display: flex; flex-direction: column; gap: 2px; }
.switch strong { font-size: 13.5px; font-weight: 600; }
.switch small { color: var(--text-2); font-size: 12.5px; }

/* ---------- import ---------- */
.drop {
  border: 2px dashed var(--line); border-radius: var(--radius);
  padding: 34px 22px; text-align: center; background: var(--surface-2);
  transition: border-color .13s ease, background .13s ease;
}
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop h3 { font-size: 16px; margin-bottom: 6px; }
.drop p { color: var(--text-2); margin: 0 0 14px; font-size: 13.5px; }

.btn {
  appearance: none; cursor: pointer; font: inherit; font-weight: 600; font-size: 13.5px;
  border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent);
  border-radius: var(--radius-sm); padding: 9px 16px;
}
.btn:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.ghost { background: transparent; color: var(--text); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--accent); background: var(--surface-2); }
.btn.danger { background: transparent; color: var(--crit); border-color: var(--crit); }
.btn.danger:hover { background: var(--crit-soft); }
.btn.sm { padding: 5px 11px; font-size: 12.5px; }

.log { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.log-item {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 10px 13px; border-radius: var(--radius-sm);
  background: var(--surface-2); font-size: 13.5px;
  border-left: 3px solid var(--text-3);
}
.log-item.ok { border-left-color: var(--good); background: var(--good-soft); }
.log-item.err { border-left-color: var(--crit); background: var(--crit-soft); }
.log-item.busy { border-left-color: var(--accent); background: var(--accent-soft); }

/* ---------- metodika ---------- */
.prose { max-width: 74ch; }
.prose h3 { margin: 22px 0 7px; font-size: 15px; }
.prose h3:first-child { margin-top: 0; }
.prose p, .prose li { color: var(--text-2); font-size: 14px; }
.prose p { margin: 0 0 10px; }
.prose ul { margin: 0 0 12px; padding-left: 20px; }
.prose li { margin-bottom: 5px; }
.prose code {
  font-family: var(--font-mono); font-size: 12.5px;
  background: var(--surface-2); border-radius: 5px; padding: 1px 5px;
}
.prose strong { color: var(--text); }

.empty { color: var(--text-2); text-align: center; padding: 40px 20px; }
.empty h3 { color: var(--text); margin-bottom: 8px; }

/* ---------- responzivita ---------- */
@media (max-width: 900px) {
  .shell { flex-direction: column; }
  .rail {
    flex: none; height: auto; position: static;
    flex-direction: row; align-items: center; gap: 14px;
    padding: 12px 16px; overflow-x: auto;
  }
  .brand-sub, .rail-note { display: none; }
  .nav { flex-direction: row; }
  .nav button { padding: 8px 11px; white-space: nowrap; }
  .rail-foot { margin-top: 0; margin-left: auto; }
  .topbar { padding: 18px 18px 14px; position: static; }
  .content { padding: 18px; }
  .demo-banner { margin: 0 18px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

@media print {
  .rail, .drop, .btn { display: none !important; }
  .card { box-shadow: none; break-inside: avoid; }
}

<script>
/* Přesčasový panel Planá — společné utility a konfigurace.
   Klasický skript (ne ES modul), aby šel index.html otevřít i z disku (file://). */
window.PP = window.PP || {}

;(function (PP) {
  'use strict'

  /* ---------- prahové hodnoty ---------- */
  PP.CFG = {
    // měsíční přesčas jednotlivce
    person: { warn: 40, crit: 60 },
    // průměr na osobu za středisko
    center: { warn: 35, crit: 45 },
    // roční součet přesčasu
    year: { warn: 150, crit: 250, cap: 416 },
  }

  /** Stupeň závažnosti podle prahů: '' | 'warn' | 'crit'. */
  PP.level = function (value, th) {
    if (value >= th.crit) return 'crit'
    if (value >= th.warn) return 'warn'
    return ''
  }

  /* ---------- formátování ---------- */
  const NF = new Intl.NumberFormat('cs-CZ')
  const NF1 = new Intl.NumberFormat('cs-CZ', { minimumFractionDigits: 1, maximumFractionDigits: 1 })

  /** Hodiny jako h:mm, se znaménkem: 54.4833 → "54:29", -2.5 → "−2:30". */
  PP.hm = function (hours) {
    if (hours == null || !isFinite(hours)) return '—'
    const sign = hours < 0 ? '−' : ''
    let total = Math.round(Math.abs(hours) * 60)
    const h = Math.floor(total / 60)
    const m = total % 60
    return sign + h + ':' + String(m).padStart(2, '0')
  }

  /** Hodiny jako desetinné číslo v českém formátu: 4625.05 → "4 625,1". */
  PP.h1 = function (hours) {
    if (hours == null || !isFinite(hours)) return '—'
    return NF1.format(hours)
  }

  /** Celé číslo v českém formátu. */
  PP.num = function (n) {
    if (n == null || !isFinite(n)) return '—'
    return NF.format(Math.round(n))
  }

  /** Procenta na celé číslo. */
  PP.pct = function (ratio) {
    if (ratio == null || !isFinite(ratio)) return '—'
    return Math.round(ratio * 100) + ' %'
  }

  /** Klíč měsíce YYYY-MM → "srpen 2026". */
  const MONTH_NAMES = [
    'leden', 'únor', 'březen', 'duben', 'květen', 'červen',
    'červenec', 'srpen', 'září', 'říjen', 'listopad', 'prosinec',
  ]
  PP.monthName = function (key) {
    const m = /^(\d{4})-(\d{2})$/.exec(key || '')
    if (!m) return key || '—'
    return MONTH_NAMES[Number(m[2]) - 1] + ' ' + m[1]
  }
  /** Klíč měsíce YYYY-MM → "8/2026". */
  PP.monthShort = function (key) {
    const m = /^(\d{4})-(\d{2})$/.exec(key || '')
    if (!m) return key || '—'
    return Number(m[2]) + '/' + m[1]
  }

  /* ---------- text ---------- */
  /** Malá písmena bez diakritiky a s normalizovanými mezerami — pro hledání a párování hlaviček. */
  PP.fold = function (s) {
    return String(s == null ? '' : s)
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/\s+/g, ' ')
      .trim()
  }

  /** Escapování do HTML. */
  PP.esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]))
  }

  /** Zvýraznění hledaného výrazu v textu (vstup se escapuje). */
  PP.mark = function (text, query) {
    const safe = PP.esc(text)
    const q = PP.fold(query)
    if (!q) return safe
    const hay = PP.fold(text)
    const at = hay.indexOf(q)
    if (at < 0) return safe
    // fold nemění délku pro běžnou českou diakritiku, offsety tedy sedí
    return PP.esc(text.slice(0, at)) + '<mark>' + PP.esc(text.slice(at, at + q.length)) +
      '</mark>' + PP.esc(text.slice(at + q.length))
  }

  /** Střední jméno střediska bez kódu: "G463 Prefix" → "Prefix". */
  PP.centerName = function (s) {
    return String(s || '').replace(/^[A-Z]?\d{2,5}\s+/, '')
  }

  /* ---------- DOM ---------- */
  PP.el = function (tag, attrs, children) {
    const node = document.createElement(tag)
    if (attrs) {
      for (const k in attrs) {
        if (k === 'class') node.className = attrs[k]
        else if (k === 'html') node.innerHTML = attrs[k]
        else if (k === 'text') node.textContent = attrs[k]
        else if (k.startsWith('on')) node.addEventListener(k.slice(2), attrs[k])
        else if (attrs[k] != null) node.setAttribute(k, attrs[k])
      }
    }
    for (const c of [].concat(children || [])) {
      if (c == null) continue
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c)
    }
    return node
  }

  PP.$ = (sel, root) => (root || document).querySelector(sel)
  PP.$$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel))
})(window.PP)
</script>

<script>
/* Perzistence importovaných měsíců.
 *
 * Vrstva je odstíněná — panel volá jen loadImported / saveImported / removeImported
 * a nezajímá ho, kam se ukládá:
 *
 *   • localStorage pod klíčem `prescasy.months.v1` (výchozí, funguje i z file://)
 *   • libovolný jiný backend přes window.PP_DB_ADAPTER (viz README) — např.
 *     kolekce `months` v úložišti publikovaného artefaktu, kde je dokumentem
 *     klíč měsíce. Jeden měsíc má cca 22 KiB, limit dokumentu je 256 KiB.
 *
 * Všechny funkce vracejí Promise, aby šel doplnit asynchronní backend.
 */
window.PP = window.PP || {}

;(function (PP) {
  'use strict'

  const LS_KEY = 'prescasy.months.v1'

  const localBackend = {
    name: 'localStorage',
    async load() {
      try {
        const raw = window.localStorage.getItem(LS_KEY)
        if (!raw) return {}
        const data = JSON.parse(raw)
        return data && typeof data === 'object' ? data : {}
      } catch (err) {
        console.warn('[store] localStorage není dostupný:', err)
        return {}
      }
    },
    async save(key, record) {
      const all = await this.load()
      all[key] = record
      window.localStorage.setItem(LS_KEY, JSON.stringify(all))
    },
    async remove(key) {
      const all = await this.load()
      delete all[key]
      window.localStorage.setItem(LS_KEY, JSON.stringify(all))
    },
  }

  const memoryBackend = {
    name: 'paměť (neukládá se)',
    data: {},
    async load() { return Object.assign({}, this.data) },
    async save(key, record) { this.data[key] = record },
    async remove(key) { delete this.data[key] },
  }

  function backend() {
    // Adaptér smí být dosazen před načtením app.js — např. wrapperem artefaktu.
    if (window.PP_DB_ADAPTER) return window.PP_DB_ADAPTER
    try {
      const probe = '__pp_probe__'
      window.localStorage.setItem(probe, '1')
      window.localStorage.removeItem(probe)
      return localBackend
    } catch (err) {
      // privátní režim, zablokované úložiště, file:// v některých prohlížečích
      return memoryBackend
    }
  }

  PP.store = {
    /** Název aktivního backendu — zobrazuje se v sekci Import. */
    get backendName() { return backend().name },

    /** Všechny importované měsíce jako mapa { 'YYYY-MM': record }. */
    loadImported() { return backend().load() },

    /** Uloží/přepíše jeden měsíc. */
    saveImported(key, record) { return backend().save(key, record) },

    /** Smaže jeden importovaný měsíc. */
    removeImported(key) { return backend().remove(key) },
  }
})(window.PP)
</script>

<script>
/* Parser Součtového výkazu z mzdového systému.
 *
 * Podporované vstupy:
 *   • .xlsx  (ZIP, začíná "PK")            → SheetJS, lazy-load z cdnjs
 *   • .xls   (legacy BIFF, začíná D0 CF)   → SheetJS
 *   • .xls   (ve skutečnosti HTML tabulka) → DOMParser  ← tohle chodí z mezd
 *   • .csv / .txt                          → oddělovač ; , nebo tab
 *
 * Výstupem je záznam měsíce v datovém modelu panelu:
 *   { period, rawPeriod, people, comps, rows: [{ n, o, s, m, e, t, r, c }], importedAt, file }
 *
 * `comps` je seznam názvů započítaných mzdových složek, `c` je rozpad člověka na ně
 * jako trojice [index do comps, hodiny, počet řádků výkazu]. Díky tomu jde u každého
 * ukázat, z čeho přesně jeho součet vznikl, aniž by se v každém řádku opakoval text.
 * `otherComps` je naopak soupis složek, které parser nezapočítal — kdyby mezi nimi
 * byla složka, která tam patřit má, je to na importu vidět.
 */
window.PP = window.PP || {}

;(function (PP) {
  'use strict'

  const SHEETJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'
  const HEADER_SCAN_ROWS = 40

  /* ---------- načtení SheetJS na požádání ---------- */
  let sheetJsPromise = null
  function loadSheetJS() {
    if (window.XLSX) return Promise.resolve(window.XLSX)
    if (sheetJsPromise) return sheetJsPromise
    sheetJsPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script')
      s.src = SHEETJS_URL
      s.onload = () => (window.XLSX ? resolve(window.XLSX) : reject(new Error('SheetJS se načetl, ale není dostupný.')))
      s.onerror = () => reject(new Error('Nepodařilo se načíst SheetJS z cdnjs — zkontrolujte připojení k síti.'))
      document.head.appendChild(s)
    })
    return sheetJsPromise
  }

  /* ---------- čtení souboru ---------- */
  function readArrayBuffer(file) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader()
      fr.onload = () => resolve(fr.result)
      fr.onerror = () => reject(new Error('Soubor se nepodařilo přečíst.'))
      fr.readAsArrayBuffer(file)
    })
  }

  /** Text z bufferu — respektuje deklarovaný charset, jinak UTF-8 s fallbackem na windows-1250. */
  function decodeText(buffer) {
    const bytes = new Uint8Array(buffer)
    const ascii = new TextDecoder('latin1').decode(bytes.subarray(0, 4096))
    const declared = /charset\s*=\s*["']?\s*([\w-]+)/i.exec(ascii)
    const tryDecode = (enc) => {
      try { return new TextDecoder(enc, { fatal: false }).decode(bytes) } catch (err) { return null }
    }
    if (declared) {
      const text = tryDecode(declared[1].toLowerCase())
      if (text) return text
    }
    const utf8 = tryDecode('utf-8')
    // U+FFFD = špatně dekódované bajty → výkaz je nejspíš v středoevropském kódování
    if (utf8 && !/�/.test(utf8)) return utf8
    return tryDecode('windows-1250') || utf8 || ''
  }

  /* ---------- převod vstupu na matici buněk ---------- */
  async function toMatrix(file) {
    const buffer = await readArrayBuffer(file)
    const head = new Uint8Array(buffer.slice(0, 8))
    const isZip = head[0] === 0x50 && head[1] === 0x4b            // "PK" → xlsx
    const isBiff = head[0] === 0xd0 && head[1] === 0xcf            // OLE2 → legacy .xls

    if (isZip || isBiff) {
      const XLSX = await loadSheetJS()
      const wb = XLSX.read(new Uint8Array(buffer), { type: 'array', cellDates: false, raw: true })
      // list s nejvíc řádky — výkaz bývá první, ale ne vždy
      let best = null
      for (const name of wb.SheetNames) {
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, blankrows: false, raw: true, defval: '' })
        if (!best || rows.length > best.length) best = rows
      }
      return { matrix: (best || []).map((r) => r.map(cellText)), kind: isZip ? 'xlsx' : 'xls (BIFF)' }
    }

    const text = decodeText(buffer)
    if (/<\s*table/i.test(text)) return { matrix: htmlToMatrix(text), kind: 'HTML tabulka (.xls z mezd)' }
    return { matrix: csvToMatrix(text), kind: 'CSV' }
  }

  function cellText(v) {
    if (v == null) return ''
    if (typeof v === 'number') return String(v)
    return String(v)
  }

  /** Vybere <table> s nejvíc řádky a převede ji na matici textů. */
  function htmlToMatrix(html) {
    const doc = new DOMParser().parseFromString(html, 'text/html')
    const tables = Array.prototype.slice.call(doc.querySelectorAll('table'))
    if (!tables.length) throw new Error('V souboru není žádná tabulka.')
    let best = tables[0]
    for (const t of tables) if (t.rows.length > best.rows.length) best = t
    return Array.prototype.map.call(best.rows, (tr) =>
      Array.prototype.map.call(tr.cells, (td) =>
        td.textContent.replace(/\u00a0/g, ' ').trim()
      )
    )
  }

  /** CSV s automatickou detekcí oddělovače, respektuje uvozovky. */
  function csvToMatrix(text) {
    const sample = text.slice(0, 8192)
    const counts = { ';': 0, ',': 0, '\t': 0 }
    for (const ch of sample) if (ch in counts) counts[ch]++
    const delim = Object.keys(counts).reduce((a, b) => (counts[b] > counts[a] ? b : a), ';')

    const rows = []
    let row = []
    let cell = ''
    let quoted = false
    for (let i = 0; i < text.length; i++) {
      const ch = text[i]
      if (quoted) {
        if (ch === '"') {
          if (text[i + 1] === '"') { cell += '"'; i++ } else quoted = false
        } else cell += ch
        continue
      }
      if (ch === '"') { quoted = true; continue }
      if (ch === delim) { row.push(cell.trim()); cell = ''; continue }
      if (ch === '\n') { row.push(cell.trim()); rows.push(row); row = []; cell = ''; continue }
      if (ch === '\r') continue
      cell += ch
    }
    if (cell || row.length) { row.push(cell.trim()); rows.push(row) }
    return rows.filter((r) => r.some((c) => c !== ''))
  }

  /* ---------- hlavička ---------- */
  const COLUMN_TESTS = {
    name: (c) => c.includes('prijmeni') && c.includes('jmeno'),
    id: (c) => c.includes('osobni'),
    center: (c) => c.includes('stredisko'),
    component: (c) => c.includes('mzdova') && c.includes('slozka'),
    hours: (c) => c.includes('hodiny'),
  }

  function findHeader(matrix) {
    const limit = Math.min(matrix.length, HEADER_SCAN_ROWS)
    for (let r = 0; r < limit; r++) {
      const cells = matrix[r].map(PP.fold)
      const cols = {}
      for (const key in COLUMN_TESTS) {
        const idx = cells.findIndex(COLUMN_TESTS[key])
        if (idx >= 0) cols[key] = idx
      }
      if (cols.name != null && cols.id != null && cols.center != null &&
          cols.component != null && cols.hours != null) {
        return { row: r, cols }
      }
    }
    throw new Error(
      'Nenašel jsem hlavičku výkazu. Očekávám sloupce Příjmení a jméno, Osobní číslo, ' +
      'Středisko, Mzdová složka a Hodiny v prvních ' + HEADER_SCAN_ROWS + ' řádcích.'
    )
  }

  /* ---------- období ---------- */
  const DATE_RANGE = /(\d{1,2})\s*\.\s*(\d{1,2})\s*\.\s*(\d{4})\s*[-–—]\s*(\d{1,2})\s*\.\s*(\d{1,2})\s*\.\s*(\d{4})/

  function findPeriod(matrix, headerRow) {
    // 1) řádek nad hlavičkou začínající "Období:"
    for (let r = headerRow; r >= 0; r--) {
      for (const cell of matrix[r]) {
        if (/^obdobi\s*:/.test(PP.fold(cell))) {
          const m = DATE_RANGE.exec(cell)
          if (m) return m
        }
      }
    }
    // 2) první výskyt d.m.yyyy - d.m.yyyy kdekoli nad hlavičkou
    for (let r = 0; r <= headerRow; r++) {
      for (const cell of matrix[r]) {
        const m = DATE_RANGE.exec(cell)
        if (m) return m
      }
    }
    return null
  }

  /** "1.8.2026 - 31.8.2026" → { key: '2026-08', period: '1. 8. – 31. 8. 2026', rawPeriod } */
  function describePeriod(m) {
    const [, d1, m1, y1, d2, m2, y2] = m.map(String)
    const key = y1 + '-' + String(Number(m1)).padStart(2, '0')
    const left = Number(y1) === Number(y2) && Number(m1) === Number(m2)
      ? `${Number(d1)}. ${Number(m1)}.`
      : `${Number(d1)}. ${Number(m1)}. ${y1}`
    const period = `${left} – ${Number(d2)}. ${Number(m2)}. ${y2}`
    return { key, period, rawPeriod: m[0].trim() }
  }

  /* ---------- hodnoty ---------- */
  /** "54:29", "-2:30", "1 234,50", "48.98" → číslo hodin. Prázdno → 0. */
  function parseHours(raw) {
    let s = String(raw == null ? '' : raw).replace(/\u00a0/g, ' ').trim()
    if (!s) return 0
    let sign = 1
    if (/^[-−]/.test(s)) { sign = -1; s = s.slice(1).trim() }
    else if (/[-−]$/.test(s)) { sign = -1; s = s.slice(0, -1).trim() }   // 12:30-
    if (/^\(.*\)$/.test(s)) { sign = -1; s = s.slice(1, -1).trim() }     // (12:30)

    const hm = /^(\d+)\s*:\s*(\d{1,2})$/.exec(s)
    if (hm) return sign * (Number(hm[1]) + Number(hm[2]) / 60)

    const num = Number(s.replace(/\s/g, '').replace(',', '.'))
    return isFinite(num) ? sign * num : 0
  }

  /** Souhrnný řádek — "Celkem", "Součet za středisko", "Mezisoučet". */
  const SUMMARY = /^(celkem|soucet|mezisoucet|total)\b/

  /** Zařazení mzdové složky: 'm' = do MEZD, 'e' = evidence, 'r' = roční součet, null = nezajímá nás. */
  function classify(component) {
    const c = PP.fold(component)
    // Sestavy tisknou mezisoučty i do sloupce mzdové složky ("Celkem za osobu").
    // Kdyby se takový řádek jmenoval "Celkem přesčas do MEZD", sečetl by se
    // k jednotlivým složkám podruhé a člověku by hodiny vyskočily na dvojnásobek.
    if (SUMMARY.test(c)) return null
    if (!c.includes('prescas')) return null
    if (c.includes('rocni') || c.includes('soucet')) return 'r'
    if (c.includes('eviden') || c.includes('konto')) return 'e'
    if (c.includes('mezd') || c.includes('proplac')) return 'm'
    return null
  }

  /* ---------- hlavní vstupní bod ---------- */
  /**
   * Rozparsuje soubor na záznam měsíce.
   * @returns {Promise<{key: string, record: object, kind: string, skipped: number}>}
   */
  PP.parseReport = async function (file) {
    const { matrix, kind } = await toMatrix(file)
    if (!matrix.length) throw new Error('Soubor je prázdný.')

    const header = findHeader(matrix)
    const cols = header.cols

    const periodMatch = findPeriod(matrix, header.row)
    if (!periodMatch) {
      throw new Error('Nenašel jsem období výkazu (řádek „Období: d.m.rrrr - d.m.rrrr“).')
    }
    const period = describePeriod(periodMatch)

    const byPerson = new Map()      // osobní číslo|středisko → agregovaný řádek
    const everyone = new Set()      // všichni lidé ve výkazu, i bez přesčasu
    const compNames = []            // započítané mzdové složky v pořadí prvního výskytu
    const compIndex = new Map()
    const otherComps = new Map()    // nezapočítané složky → kolik jich ve výkazu bylo
    let skipped = 0

    // Sestavy z mezd tisknou jméno, osobní číslo a středisko často jen na prvním
    // řádku skupiny a další mzdové složky nechávají tyhle sloupce prázdné.
    // Takový řádek proto přebírá identitu z předchozího, jinak by se ztratil.
    let last = null

    for (let r = header.row + 1; r < matrix.length; r++) {
      const row = matrix[r]
      if (!row || !row.length) continue

      const id = String(row[cols.id] || '').trim()
      const name = String(row[cols.name] || '').trim()
      const center = String(row[cols.center] || '').trim()

      // souhrnné řádky "Celkem …" ukončují skupinu, identita se dál nedědí
      if (SUMMARY.test(PP.fold(name))) { last = null; continue }

      let who
      if (!name && !id) {
        // pokračovací řádek — bez předchozí identity ho zahodit musíme
        if (!last) continue
        who = last
      } else if (!id && last && PP.fold(last.n) === PP.fold(name)) {
        // jméno se opakuje, ale číslo je vyplněné jen jednou
        who = { n: last.n, o: last.o, s: center || last.s }
        last = who
      } else {
        who = { n: name, o: id, s: center }
        last = who
        // Do stavu osob počítáme jen řádky s osobním číslem. Sestavy mívají
        // mezisoučty nadepsané jménem bez čísla a ty nejsou další člověk.
        if (id) everyone.add(id + '|' + center)
      }
      if (!who.o && !who.n) continue

      const component = String(row[cols.component] || '').trim()
      const bucket = classify(component)
      if (!bucket) {
        skipped++
        if (component && !SUMMARY.test(PP.fold(component))) {
          otherComps.set(component, (otherComps.get(component) || 0) + 1)
        }
        continue
      }

      const key = (who.o || who.n) + '|' + who.s
      const hours = parseHours(row[cols.hours])
      let rec = byPerson.get(key)
      if (!rec) {
        rec = {
          n: who.n,
          o: /^\d+$/.test(String(who.o)) ? Number(who.o) : who.o,
          s: who.s, m: 0, e: 0, t: 0, r: 0,
          c: new Map(),
        }
        byPerson.set(key, rec)
      }
      rec[bucket] += hours

      let ci = compIndex.get(component)
      if (ci == null) { ci = compNames.length; compNames.push(component); compIndex.set(component, ci) }
      const cur = rec.c.get(ci) || { h: 0, rows: 0 }
      cur.h += hours
      cur.rows++
      rec.c.set(ci, cur)
    }

    const round2 = (v) => Math.round(v * 100) / 100
    const rows = Array.from(byPerson.values())
      .map((rec) => {
        rec.m = round2(rec.m)
        rec.e = round2(rec.e)
        rec.r = round2(rec.r)
        rec.t = round2(rec.m + rec.e)
        // [index složky, hodiny, kolik řádků výkazu se sečetlo]
        rec.c = Array.from(rec.c.entries())
          .map(([i, v]) => [i, round2(v.h), v.rows])
          .sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]))
        return rec
      })
      .sort((a, b) => b.t - a.t || String(a.n).localeCompare(String(b.n), 'cs'))

    if (!rows.length) {
      throw new Error('Ve výkazu nejsou žádné přesčasové mzdové složky.')
    }

    return {
      key: period.key,
      kind,
      skipped,
      record: {
        period: period.period,
        rawPeriod: period.rawPeriod,
        // pojistka pro výkazy bez osobních čísel — stav nesmí být menší
        // než počet lidí, kteří v něm mají přesčas
        people: Math.max(everyone.size, rows.length),
        comps: compNames,
        otherComps: Array.from(otherComps.entries()).sort((a, b) => b[1] - a[1]),
        rows,
        importedAt: new Date().toISOString(),
        file: file.name,
      },
    }
  }

  // zařazení složky potřebuje i UI, aby u rozpadu ukázalo, kam která patří
  PP.componentBucket = classify

  // sdíleno s exportem — SheetJS se stahuje jen jednou, na požádání
  PP.loadSheetJS = loadSheetJS

  // vystaveno kvůli testům a případnému CLI použití
  PP.parserInternals = { parseHours, classify, csvToMatrix, htmlToMatrix, findHeader, describePeriod, DATE_RANGE }
})(window.PP)
</script>

<!-- js/export.js -->
<script>
/* Export do Excelu.
 *
 * Používá stejný SheetJS, jaký se stahuje kvůli importu .xlsx — načte se
 * až při prvním exportu, ne při startu panelu.
 *
 * Hodiny jsou v sešitu jako desetinná čísla, aby se daly sčítat a filtrovat.
 * Klíčové sloupce mají vedle sebe i tvar h:mm, protože v tom je výkaz čitelný.
 * Časový formát Excelu se schválně nepoužívá — evidence bývá záporná a záporný
 * čas Excel neumí zobrazit (ukáže ####).
 */
window.PP = window.PP || {}

;(function (PP) {
  'use strict'

  const CFG = PP.CFG

  /** Pásmo pro sloupec v sešitu — ať jde v Excelu filtrovat. */
  function band(value, th) {
    const lvl = PP.level(value, th)
    return lvl === 'crit' ? 'kritické' : lvl === 'warn' ? 'sledovat' : 'ok'
  }

  const round2 = (v) => Math.round(v * 100) / 100

  function sheetFrom(XLSX, rows, widths) {
    const ws = XLSX.utils.aoa_to_sheet(rows)
    if (widths) ws['!cols'] = widths.map((w) => ({ wch: w }))
    if (rows.length > 1) {
      ws['!autofilter'] = { ref: XLSX.utils.encode_range({
        s: { r: 0, c: 0 },
        e: { r: rows.length - 1, c: rows[0].length - 1 },
      }) }
    }
    return ws
  }

  /* ---------- jednotlivé listy ---------- */

  function souhrn(rec, key, s, cmp, prevKey) {
    const rows = [
      ['Ukazatel', 'Hodnota'],
      ['Měsíc', PP.monthName(key)],
      ['Období', rec.period || ''],
      ['Osob ve výkazu', s.people],
      ['Lidí s přesčasem', s.withOvertime],
      ['Přesčas celkem (h)', round2(s.total)],
      ['Do MEZD (h)', round2(s.mezdy)],
      ['Evidence (h)', round2(s.evidence)],
      ['Podíl proplacených', round2(s.paidShare)],
      ['Ø na osobu (h)', round2(s.avg)],
      ['Ø na osobu (h:mm)', PP.hm(s.avg)],
      ['Maximum (h)', round2(s.max)],
      ['Nad ' + CFG.person.warn + ' h za měsíc', s.overWarn],
      ['Nad ' + CFG.person.crit + ' h za měsíc', s.overCrit],
      ['Nad ' + CFG.year.warn + ' h ročně', s.year150],
      ['Nad ' + CFG.year.crit + ' h ročně', s.year250],
      ['Na stropu ' + CFG.year.cap + ' h', s.yearCap],
    ]
    if (cmp) {
      rows.push([], ['Proti měsíci', PP.monthName(prevKey)])
      rows.push(['Δ přesčas celkem (h)', round2(cmp.dTotal)])
      rows.push(['Δ lidí s přesčasem', cmp.dPeople])
      rows.push(['Δ Ø na osobu (h)', round2(cmp.dAvg)])
      rows.push(['Δ podíl proplacených', round2(cmp.dPaidShare)])
      rows.push(['Vypadli', cmp.dropped.length])
      rows.push(['Přibyli', cmp.added.length])
    }
    rows.push([], ['Zdroj', rec.file || ''])
    if (rec.demo) rows.push(['Pozor', 'UKÁZKOVÁ DATA — jména i hodiny jsou vymyšlené'])
    return rows
  }

  function strediska(s, cmp) {
    const dmap = new Map((cmp ? cmp.centers : []).map((c) => [c.name, c]))
    const head = ['Středisko', 'Lidí', 'Celkem (h)', 'Ø na osobu (h)', 'Ø (h:mm)',
      'Do MEZD (h)', 'Evidence (h)', 'Maximum (h)', 'Pásmo']
    if (cmp) head.push('Δ Ø (h)', 'Δ celkem (h)')
    const rows = [head]
    for (const c of s.byTotal) {
      const r = [c.name, c.people, round2(c.total), round2(c.avg), PP.hm(c.avg),
        round2(c.m), round2(c.e), round2(c.max), band(c.avg, CFG.center)]
      if (cmp) {
        const d = dmap.get(c.name)
        r.push(d && d.dAvg != null ? round2(d.dAvg) : '', d && d.dTotal != null ? round2(d.dTotal) : '')
      }
      rows.push(r)
    }
    return rows
  }

  function lide(s) {
    const rows = [['Jméno', 'Osobní číslo', 'Středisko', 'Do MEZD (h)', 'Evidence (h)',
      'Přesčas (h)', 'Přesčas (h:mm)', 'Pásmo', 'Roční součet (h)', 'Roční (h:mm)',
      'Zbývá do ' + CFG.year.cap + ' h', 'Pásmo ročně']]
    for (const r of s.ranking) {
      rows.push([r.n, r.o, r.s, round2(r.m), round2(r.e), round2(r.t), PP.hm(r.t),
        band(r.t, CFG.person), round2(r.r), PP.hm(r.r),
        round2(Math.max(0, CFG.year.cap - r.r)),
        band(r.r, { warn: CFG.year.warn, crit: CFG.year.crit })])
    }
    return rows
  }

  function zmeny(cmp, keyA, keyB) {
    const rows = [['Typ', 'Jméno', 'Osobní číslo', 'Středisko',
      PP.monthShort(keyA) + ' (h)', PP.monthShort(keyB) + ' (h)', 'Δ (h)']]
    for (const r of cmp.dropped) {
      rows.push(['vypadl', r.n, r.o, r.s, round2(r.t), 0, round2(-r.t)])
    }
    for (const r of cmp.added) {
      rows.push(['přibyl', r.n, r.o, r.s, 0, round2(r.t), round2(r.t)])
    }
    for (const m of cmp.movers) {
      rows.push(['zůstal', m.r.n, m.r.o, m.r.s, round2(m.prev.t), round2(m.r.t), round2(m.d)])
    }
    return rows
  }

  /* ---------- vstupní bod ---------- */

  /**
   * Sestaví a stáhne sešit za jeden měsíc. Když existuje předchozí měsíc,
   * přidá i listy se srovnáním.
   * @param {string} key klíč měsíce YYYY-MM
   * @param {string|null} prevKey klíč měsíce k porovnání, nebo null
   */
  PP.exportExcel = async function (key, prevKey) {
    const rec = PP.data.month(key)
    if (!rec) throw new Error('Měsíc ' + key + ' není načtený.')
    const XLSX = await PP.loadSheetJS()

    const s = PP.stats(rec)
    const prev = prevKey ? PP.data.month(prevKey) : null
    const cmp = prev ? PP.compare(rec, prev) : null

    const wb = XLSX.utils.book_new()
    XLSX.utils.book_append_sheet(wb, sheetFrom(XLSX, souhrn(rec, key, s, cmp, prevKey), [30, 46]), 'Souhrn')
    XLSX.utils.book_append_sheet(wb, sheetFrom(XLSX, strediska(s, cmp), [24, 7, 12, 14, 11, 12, 12, 12, 11, 10, 12]), 'Střediska')
    XLSX.utils.book_append_sheet(wb, sheetFrom(XLSX, lide(s), [30, 13, 22, 12, 12, 12, 14, 10, 15, 12, 16, 12]), 'Lidé')
    if (cmp) {
      XLSX.utils.book_append_sheet(wb, sheetFrom(XLSX, zmeny(cmp, prevKey, key), [10, 30, 13, 22, 12, 12, 10]), 'Změny lidí')
    }

    const name = 'Prescasy_' + key + (cmp ? '_vs_' + prevKey : '') + '.xlsx'
    XLSX.writeFile(wb, name)
    return { name, sheets: wb.SheetNames }
  }
})(window.PP)
</script>

<script>
/* Spojnicové grafy vývoje. Vlastní SVG, bez knihovny — panel se nemá
 * čím rozbít offline a nepotřebuje build.
 *
 * Kreslí se do změřené šířky kontejneru, ne do škálovaného viewBoxu, aby
 * popisky měly na každé šířce stejnou velikost.
 */
window.PP = window.PP || {}

;(function (PP) {
  'use strict'

  /* Kategoriální paleta pro víc sérií. Firemní teal je sémantická barva
     (accent), na rozlišení entit se nehodí. Tyhle odstíny jsou ověřené na
     rozlišitelnost při barvosleposti proti světlému i tmavému povrchu panelu. */
  const SERIES_LIGHT = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4']
  const SERIES_DARK = ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181']

  function isDark() {
    const attr = document.documentElement.getAttribute('data-theme')
    if (attr === 'dark') return true
    if (attr === 'light') return false
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
  }

  PP.seriesColors = function () { return isDark() ? SERIES_DARK : SERIES_LIGHT }

  const NS = 'http://www.w3.org/2000/svg'
  const el = (name, attrs) => {
    const n = document.createElementNS(NS, name)
    for (const k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k])
    return n
  }

  /** Hezký krok osy — 1/2/2,5/5 × 10^n. */
  function niceStep(span, count) {
    const raw = span / count
    const mag = Math.pow(10, Math.floor(Math.log10(raw || 1)))
    return [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw) || 10 * mag
  }

  /**
   * Dělení osy y. Nula je vždycky uvnitř rozsahu — u člověka může měsíc vyjít
   * záporně (proplacené konto se odečte z evidence) a čára nesmí zmizet pod osu.
   */
  function ticks(min, max, count) {
    const lo = Math.min(0, min)
    const hi = Math.max(0, max)
    if (lo === hi) return [0, 1]
    const step = niceStep(hi - lo, count)
    const from = Math.floor(lo / step) * step
    const to = Math.ceil(hi / step) * step
    const out = []
    for (let v = from; v <= to + step * 0.001; v += step) {
      out.push(Math.abs(v) < step * 1e-9 ? 0 : v)
    }
    return out
  }

  /**
   * Vykreslí spojnicový graf.
   *
   * @param {HTMLElement} host   kontejner; obsah se přepíše
   * @param {object} spec
   *   labels   popisky osy x
   *   series   [{ name, color, values }] — values může obsahovat null (chybí)
   *   format   funkce pro hodnotu v popisku a tooltipu
   *   area     vyplnit plochu pod čarou (jen u jedné série)
   *   endLabel přidat popisek na konec čáry (u víc sérií)
   */
  PP.lineChart = function (host, spec) {
    const width = Math.max(320, host.clientWidth || 640)
    const height = spec.height || 260
    const endRoom = spec.endLabel ? 94 : 16
    const pad = { t: 14, r: endRoom, b: 30, l: 56 }
    const iw = width - pad.l - pad.r
    const ih = height - pad.t - pad.b

    const all = spec.series.flatMap((s) => s.values).filter((v) => v != null && isFinite(v))
    const maxVal = all.length ? Math.max.apply(null, all) : 1
    const minVal = all.length ? Math.min.apply(null, all) : 0

    let ys, yMin, yMax
    if (spec.domainMax != null) {
      // Osa končí přesně na zadané hodnotě — u ročního součtu je tou hodnotou
      // strop, takže je z grafu vidět, kolik z povolených hodin je vyčerpáno.
      yMin = Math.min(0, minVal)
      yMax = Math.max(spec.domainMax, maxVal)
      const step = niceStep(yMax - yMin, 5)
      ys = []
      for (let v = Math.ceil(yMin / step) * step; v <= yMax + step * 0.001; v += step) {
        if (v <= yMax) ys.push(Math.abs(v) < step * 1e-9 ? 0 : v)
      }
      if (!ys.length) ys = [yMin, yMax]
    } else {
      ys = ticks(minVal * 1.02, maxVal * 1.02, 4)
      yMin = ys[0]
      yMax = ys[ys.length - 1]
    }
    const span = yMax - yMin || 1

    const x = (i) => pad.l + (spec.labels.length < 2 ? iw / 2 : (i / (spec.labels.length - 1)) * iw)
    const y = (v) => pad.t + ih - ((v - yMin) / span) * ih

    host.innerHTML = ''
    host.style.position = 'relative'
    const svg = el('svg', {
      width, height, viewBox: `0 0 ${width} ${height}`,
      role: 'img', 'aria-label': spec.ariaLabel || 'Graf vývoje', class: 'chart',
    })

    // mřížka a osa y
    for (const v of ys) {
      svg.appendChild(el('line', {
        x1: pad.l, x2: pad.l + iw, y1: y(v), y2: y(v),
        class: v === 0 ? 'chart-axis' : 'chart-grid',
      }))
      const t = el('text', { x: pad.l - 9, y: y(v) + 4, class: 'chart-tick', 'text-anchor': 'end' })
      t.textContent = (spec.tickFormat || spec.format)(v)
      svg.appendChild(t)
    }

    // osa x
    spec.labels.forEach((lab, i) => {
      const t = el('text', { x: x(i), y: pad.t + ih + 19, class: 'chart-tick', 'text-anchor': 'middle' })
      t.textContent = lab
      svg.appendChild(t)
    })

    // série
    const endLabels = []
    spec.series.forEach((s) => {
      const pts = s.values
        .map((v, i) => (v == null ? null : [x(i), y(v)]))
        .filter(Boolean)
      if (!pts.length) return
      const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ')

      if (spec.area) {
        svg.appendChild(el('path', {
          d: d + ` L${pts[pts.length - 1][0].toFixed(1)} ${y(0)} L${pts[0][0].toFixed(1)} ${y(0)} Z`,   // plocha vždy k nule
          fill: s.color, opacity: 0.12, stroke: 'none',
        }))
      }
      svg.appendChild(el('path', { d, fill: 'none', stroke: s.color, class: 'chart-line' }))
      pts.forEach((p) => svg.appendChild(el('circle', {
        cx: p[0], cy: p[1], r: 4, fill: s.color, class: 'chart-dot',
      })))

      if (spec.endLabel) {
        const last = pts[pts.length - 1]
        endLabels.push({ x: last[0] + 10, y: last[1], name: s.name, color: s.color })
      }
    })

    // Koncové popisky se u blízkých čar překrývají — rozhrnout je od sebe,
    // pořadí shora dolů zůstává, takže popisek pořád patří ke své čáře.
    if (endLabels.length) {
      const GAP = 15
      endLabels.sort((a, b) => a.y - b.y)
      for (let i = 1; i < endLabels.length; i++) {
        if (endLabels[i].y - endLabels[i - 1].y < GAP) endLabels[i].y = endLabels[i - 1].y + GAP
      }
      const overflow = endLabels[endLabels.length - 1].y - (pad.t + ih)
      if (overflow > 0) {
        const shift = Math.min(overflow, endLabels[0].y - pad.t)
        for (const l of endLabels) l.y -= shift
      }
      for (const l of endLabels) {
        const t = el('text', { x: l.x, y: l.y + 4, class: 'chart-end', fill: l.color })
        t.textContent = l.name
        svg.appendChild(t)
      }
    }

    // prahové čáry (např. 40 a 60 h u jednotlivce)
    for (const ref of spec.refs || []) {
      if (ref.value > yMax || ref.value < yMin) continue
      svg.appendChild(el('line', {
        x1: pad.l, x2: pad.l + iw, y1: y(ref.value), y2: y(ref.value),
        class: 'chart-ref ' + (ref.tone || ''),
      }))
      const t = el('text', { x: pad.l + iw - 4, y: y(ref.value) - 5, class: 'chart-ref-label ' + (ref.tone || ''), 'text-anchor': 'end' })
      t.textContent = ref.label
      svg.appendChild(t)
    }

    // vrstva pro najetí myší
    const cross = el('line', { y1: pad.t, y2: pad.t + ih, class: 'chart-cross', opacity: 0 })
    svg.appendChild(cross)
    const hot = el('rect', { x: pad.l, y: pad.t, width: iw, height: ih, fill: 'transparent' })
    svg.appendChild(hot)
    host.appendChild(svg)

    const tip = document.createElement('div')
    tip.className = 'chart-tip'
    tip.hidden = true
    host.appendChild(tip)

    const nearest = (px) => {
      let best = 0
      for (let i = 1; i < spec.labels.length; i++) {
        if (Math.abs(px - x(i)) < Math.abs(px - x(best))) best = i
      }
      return best
    }

    function show(ev) {
      const box = svg.getBoundingClientRect()
      const i = nearest(((ev.clientX - box.left) / box.width) * width)
      cross.setAttribute('x1', x(i))
      cross.setAttribute('x2', x(i))
      cross.setAttribute('opacity', 1)
      tip.innerHTML = `<strong>${PP.esc(spec.labels[i])}</strong>` +
        spec.series.map((s) => s.values[i] == null ? '' : `
          <span class="row"><i style="background:${s.color}"></i>
          <span class="nm">${PP.esc(s.name)}</span>
          <span class="vl">${PP.esc(spec.format(s.values[i]))}</span></span>`).join('')
      tip.hidden = false
      const left = (x(i) / width) * box.width
      tip.style.left = Math.min(Math.max(left, 8), box.width - tip.offsetWidth - 8) + 'px'
    }
    function hide() {
      cross.setAttribute('opacity', 0)
      tip.hidden = true
    }
    hot.addEventListener('mousemove', show)
    hot.addEventListener('mouseleave', hide)
    svg.addEventListener('touchstart', (e) => { if (e.touches[0]) show(e.touches[0]) }, { passive: true })
    svg.addEventListener('touchmove', (e) => { if (e.touches[0]) show(e.touches[0]) }, { passive: true })
  }

  /* Překreslení po změně šířky. Pozorovatel je jeden, přepíná se na aktuální
     sadu grafů, aby se nehromadily po každém překreslení sekce. */
  let observer = null
  PP.watchCharts = function (redraw) {
    if (observer) observer.disconnect()
    if (!window.ResizeObserver) return
    const host = document.querySelector('.content')
    if (!host) return

    // Překresluje se jen při skutečné změně šířky. Bez toho by překreslení
    // grafu změnilo výšku obsahu, pozorovatel by se spustil znovu a točilo
    // by se to dokola — a každé překreslení by navíc zahodilo rozkreslený
    // tooltip pod kurzorem.
    let lastWidth = host.clientWidth
    let timer = null
    observer = new ResizeObserver(() => {
      if (host.clientWidth === lastWidth) return
      lastWidth = host.clientWidth
      clearTimeout(timer)
      timer = setTimeout(redraw, 120)
    })
    observer.observe(host)
  }
})(window.PP)
</script>
