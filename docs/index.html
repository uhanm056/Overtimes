<script>
/* Datová vrstva: sloučení vestavěných a importovaných měsíců + odvozené statistiky. */
window.PP = window.PP || {}

;(function (PP) {
  'use strict'

  const state = {
    months: {},        // 'YYYY-MM' → record
    imported: {},      // podmnožina, kterou lze smazat
    method: null,      // 'move' | 'balance' | 'unclear' | null — co znamená sloupec evidence
    methodInfo: null,  // čím se to rozhodlo
  }

  PP.data = {
    state,

    /** Načte vestavěná data a přes ně položí importované měsíce (import přepisuje). */
    async init() {
      const builtin = window.PP_BUILTIN_MONTHS || {}
      state.imported = await PP.store.loadImported()
      state.months = {}
      for (const key in builtin) state.months[key] = Object.assign({ source: 'builtin' }, builtin[key])
      for (const key in state.imported) {
        state.months[key] = Object.assign({ source: 'imported' }, state.imported[key])
      }
      applyMethodology()
      return state.months
    },

    /** Co vyšlo z měření: 'move', 'balance', 'unclear', nebo null když není co měřit. */
    get method() { return state.method },
    get methodInfo() { return state.methodInfo },

    /** Klíče měsíců od nejnovějšího. */
    keys() {
      return Object.keys(state.months).sort().reverse()
    },

    month(key) {
      return state.months[key] || null
    },

    isImported(key) {
      return Object.prototype.hasOwnProperty.call(state.imported, key)
    },

    /** Obsahuje panel jen ukázková data? */
    isDemoOnly() {
      const keys = this.keys()
      return keys.length > 0 && keys.every((k) => state.months[k].demo)
    },

    async addMonth(key, record) {
      await PP.store.saveImported(key, record)
      state.imported[key] = record
      state.months[key] = Object.assign({ source: 'imported' }, record)
      applyMethodology()
    },

    /** Položí přes vestavěná data to, co přišlo z webu (veřejné vydání). */
    /* Data z webu NAHRAZUJÍ všechno zapečené, nepřekládají se přes něj.
       V souboru je vzorek jen pro případ, že by databáze byla nedostupná;
       kdyby se s živými čísly smíchal, viděli by kolegové vedle skutečných
       měsíců i vymyšlené a nepoznali by, které je které. */
    setRemote(months) {
      if (!months || !Object.keys(months).length) return false
      state.months = {}
      for (const key in months) {
        state.months[key] = Object.assign({ source: 'remote' }, months[key])
      }
      applyMethodology()
      return true
    },

    /** Smaže importovaný měsíc; pokud pro něj existují vestavěná data, vrátí se. */
    async removeMonth(key) {
      await PP.store.removeImported(key)
      delete state.imported[key]
      const builtin = window.PP_BUILTIN_MONTHS || {}
      if (builtin[key]) state.months[key] = Object.assign({ source: 'builtin' }, builtin[key])
      else delete state.months[key]
      applyMethodology()
    },
  }

  /* ---------- co znamená sloupec „Přesčas evidence“ ----------
     Mzdový systém tiskne dva údaje, které se dají sečíst dvěma způsoby:

       A) evidence je POHYB za měsíc      → přesčas = MEZD + evidence
       B) evidence je STAV konta na konci → přesčas = MEZD + (konto teď − konto minule)

     Rozdíl není kosmetický: u člověka s velkým kontem je A klidně dvojnásobek
     skutečnosti, protože se zůstatek připočte každý měsíc znovu. Hádat se to
     nemusí — roční součet z mzdového systému říká, o kolik ten měsíc přesčasu
     doopravdy přibylo, a podle něj se obě varianty změří na všech lidech
     a všech dvojicích měsíců, které panel má. */

  const PAIR_TOLERANCE = 0.02      // dvě minuty, kvůli zaokrouhlení h:mm
  const CONFIDENCE = 0.95          // kolik lidí musí variantě odpovídat

  /* Ukázkové měsíce se do měření nepočítají a nepřepočítávají. Je to
     vygenerovaný vzorek a nemá rozhodovat, jak se čtou reálné výkazy —
     ani se jím nechat přepsat. */
  function realKeys() {
    return Object.keys(state.months)
      .filter((k) => state.months[k] && !state.months[k].demo && state.months[k].rows)
      .sort()
  }

  function measureMethod(keys) {
    let checked = 0
    let okMove = 0
    let okBalance = 0

    for (let i = 1; i < keys.length; i++) {
      const cur = state.months[keys[i]]
      const prev = state.months[keys[i - 1]]
      if (!cur || !prev || !cur.rows || !prev.rows) continue
      const prevById = new Map(prev.rows.map((r) => [String(r.o), r]))
      for (const row of cur.rows) {
        const p = prevById.get(String(row.o))
        if (!p || row.r == null || p.r == null) continue
        checked++
        const dr = round2(row.r - p.r)
        if (Math.abs(dr - round2(row.m + row.e)) <= PAIR_TOLERANCE) okMove++
        if (Math.abs(dr - round2(row.m + (row.e - p.e))) <= PAIR_TOLERANCE) okBalance++
      }
    }

    const share = (n) => (checked ? n / checked : 0)
    const verdict = !checked ? null
      : share(okBalance) >= CONFIDENCE && okBalance > okMove ? 'balance'
      : share(okMove) >= CONFIDENCE && okMove > okBalance ? 'move'
      : 'unclear'
    return { verdict, checked, okMove, okBalance }
  }

  /** Dosadí do každého řádku `t` podle toho, co měření ukázalo. */
  function applyMethodology() {
    const keys = realKeys()
    const info = measureMethod(keys)
    state.method = info.verdict
    state.methodInfo = info

    /* Agregáty z webu řádky s lidmi nemají, takže se v nich nedá nic změřit.
       Metodiku s sebou nesou od toho, kdo je zveřejnil — bez ní by veřejná
       stránka popisovala sloupce jinak než panel, ze kterého čísla vyšla. */
    if (!info.checked) {
      for (const k of Object.keys(state.months).sort().reverse()) {
        const rec = state.months[k]
        if (rec && rec.aggregate && rec.method) { state.method = rec.method; break }
      }
    }

    // ukázkové měsíce zůstávají, jak jsou
    for (const k of Object.keys(state.months)) {
      const rec = state.months[k]
      if (!rec || !rec.rows || !rec.demo) continue
      rec.methodIncomplete = false
      for (const row of rec.rows) {
        if (row.tRaw === undefined) row.tRaw = round2(row.m + row.e)
        row.t = row.tRaw
        row.de = null
      }
    }

    for (let i = 0; i < keys.length; i++) {
      const rec = state.months[keys[i]]
      if (!rec || !rec.rows) continue
      const prev = i > 0 ? state.months[keys[i - 1]] : null
      const prevById = prev && prev.rows
        ? new Map(prev.rows.map((r) => [String(r.o), r]))
        : null

      /* Nejstarší měsíc nemá s čím porovnat konto, takže se u něj skutečný
         přesčas spočítat nedá. Zůstává v něm hodnota z výkazu a měsíc se
         označí — stačí naimportovat o měsíc starší výkaz a dopočítá se. */
      rec.methodIncomplete = state.method === 'balance' && !prevById

      for (const row of rec.rows) {
        if (row.tRaw === undefined) row.tRaw = round2(row.m + row.e)
        if (state.method !== 'balance' || !prevById) { row.t = row.tRaw; row.de = null; continue }
        const p = prevById.get(String(row.o))
        // kdo minulý měsíc ve výkazu nebyl, nemá se od čeho odrazit
        row.de = p ? round2(row.e - p.e) : null
        row.t = p ? round2(row.m + row.de) : row.tRaw
      }
    }
    cache = new WeakMap()
  }

  PP.measureMethod = measureMethod

  /* ---------- odvozené statistiky ---------- */

  const HIST_BUCKETS = [
    { from: -Infinity, to: 0, label: '≤ 0' },
    { from: 0, to: 10, label: '0–10' },
    { from: 10, to: 20, label: '10–20' },
    { from: 20, to: 30, label: '20–30' },
    { from: 30, to: 40, label: '30–40' },
    { from: 40, to: 50, label: '40–50' },
    { from: 50, to: 60, label: '50–60' },
    { from: 60, to: Infinity, label: '60+' },
  ]

  let cache = new WeakMap()

  /**
   * Souhrn nad agregovaným měsícem — takový záznam žádné lidi neobsahuje,
   * jen předpočítaná čísla za střediska. Používá ho veřejné vydání panelu.
   */
  function aggregateStats(record) {
    const s = record.summary
    const centers = s.centers.map((c) => {
      const avg = c.people ? c.total / c.people : 0
      return Object.assign({}, c, { avg, level: PP.level(avg, PP.CFG.center), rows: [] })
    })
    return {
      key: null,
      aggregate: true,
      people: record.people,
      withOvertime: s.withOvertime,
      total: s.total,
      mezdy: s.mezdy,
      evidence: s.evidence,
      paidShare: s.total !== 0 ? s.mezdy / s.total : 0,
      avg: s.withOvertime ? s.total / s.withOvertime : 0,
      max: 0,                       // nejvyšší hodnota jednotlivce se nezveřejňuje
      overWarn: s.overWarn,
      overCrit: s.overCrit,
      centers,
      byAvg: centers.slice().sort((a, b) => b.avg - a.avg),
      byTotal: centers.slice().sort((a, b) => b.total - a.total),
      hist: s.hist,
      yearly: [],                   // jmenné pohledy v agregátu neexistují
      ranking: [],
      year150: s.year150,
      year250: s.year250,
      yearCap: s.yearCap,
    }
  }

  /** Spočítá (a zapamatuje si) souhrn nad jedním měsícem. */
  PP.stats = function (record) {
    if (!record) return null
    if (cache.has(record)) return cache.get(record)
    if (record.aggregate) {
      const agg = aggregateStats(record)
      cache.set(record, agg)
      return agg
    }

    const rows = record.rows || []
    const sum = (f) => rows.reduce((a, r) => a + (Number(r[f]) || 0), 0)
    const total = sum('t')
    const mezdy = sum('m')
    /* Druhá složka je to, co k proplaceným hodinám zbývá do celku — ne syrový
       sloupec evidence. Když se počítá přes přírůstek konta, je zbytek právě
       ten přírůstek; sečíst syrové zůstatky by dalo číslo, které k součtu
       nepasuje, a v tabulce by Do MEZD + Evidence nedávalo Celkem. */
    const evidence = round2(total - mezdy)

    const centers = new Map()
    for (const r of rows) {
      let c = centers.get(r.s)
      if (!c) {
        c = { name: r.s, people: 0, total: 0, m: 0, e: 0, max: -Infinity, rows: [] }
        centers.set(r.s, c)
      }
      c.people++
      c.total += r.t
      c.m += r.m
      c.e += r.t - r.m
      if (r.t > c.max) c.max = r.t
      c.rows.push(r)
    }
    for (const c of centers.values()) {
      c.avg = c.people ? c.total / c.people : 0
      c.level = PP.level(c.avg, PP.CFG.center)
      c.rows.sort((a, b) => b.t - a.t)
    }

    const hist = HIST_BUCKETS.map((b) => ({
      label: b.label,
      count: rows.filter((r) => (b.to === 0 ? r.t <= 0 : r.t > b.from && r.t <= b.to)).length,
    }))

    const yearly = rows.slice().sort((a, b) => b.r - a.r)

    const out = {
      key: null,
      people: record.people || rows.length,
      withOvertime: rows.length,
      total,
      mezdy,
      evidence,
      paidShare: total !== 0 ? mezdy / total : 0,
      avg: rows.length ? total / rows.length : 0,
      max: rows.length ? Math.max.apply(null, rows.map((r) => r.t)) : 0,
      overWarn: rows.filter((r) => r.t >= PP.CFG.person.warn).length,
      overCrit: rows.filter((r) => r.t >= PP.CFG.person.crit).length,
      centers: Array.from(centers.values()),
      byAvg: Array.from(centers.values()).sort((a, b) => b.avg - a.avg),
      byTotal: Array.from(centers.values()).sort((a, b) => b.total - a.total),
      hist,
      yearly,
      year150: rows.filter((r) => r.r > PP.CFG.year.warn).length,
      year250: rows.filter((r) => r.r > PP.CFG.year.crit).length,
      yearCap: rows.filter((r) => r.r >= PP.CFG.year.cap).length,
      ranking: rows.slice().sort((a, b) => b.t - a.t),
    }
    cache.set(record, out)
    return out
  }

  /**
   * Seznam všech lidí napříč měsíci — pro vyhledávání. Jméno a středisko se
   * berou z nejnovějšího měsíce, ve kterém člověk je (mohl se přeřadit).
   */
  PP.roster = function () {
    const out = new Map()
    for (const key of PP.data.keys()) {          // od nejnovějšího
      for (const r of PP.data.month(key).rows || []) {
        const id = String(r.o)
        if (!out.has(id)) out.set(id, { o: r.o, n: r.n, s: r.s, months: 0 })
        out.get(id).months++
      }
    }
    return Array.from(out.values()).sort((a, b) => String(a.n).localeCompare(String(b.n), 'cs'))
  }

  /**
   * Historie jednoho člověka přes všechny měsíce, od nejstaršího.
   * Měsíc, ve kterém ve výkazu není, má hodnoty null — ne nulu: nulový přesčas
   * a „ve výkazu vůbec není“ jsou dvě různé věci.
   */
  PP.personHistory = function (id) {
    const wanted = String(id)
    const keys = PP.data.keys().slice().reverse()
    const points = []
    let person = null
    let lastR = 0

    for (const k of keys) {
      const rec = PP.data.month(k)
      const stats = PP.stats(rec)
      const row = (rec.rows || []).find((r) => String(r.o) === wanted)
      if (row) {
        person = { o: row.o, n: row.n, s: row.s }
        lastR = row.r
      }
      points.push({
        key: k,
        period: rec.period,
        row: row || null,
        t: row ? row.t : null,
        m: row ? row.m : null,
        e: row ? row.e : null,
        // roční součet drží i v měsíci bez přesčasu — nikam neklesá
        r: row ? row.r : (points.length ? lastR : null),
        rank: row ? stats.ranking.indexOf(row) + 1 : null,
        of: stats.withOvertime,
        de: row ? row.de : null,
        // rozpad na mzdové složky — ať je vidět, z čeho se součet skládá
        comps: row && row.c && rec.comps
          ? row.c.map(([i, h, n]) => ({ name: rec.comps[i] || '(bez názvu)', h, rows: n }))
          : null,
        center: row ? stats.centers.find((c) => c.name === row.s) : null,
      })
    }
    if (!person) return null

    /* Přírůstek ročního součtu proti předchozímu měsíci. Pokud mzdový systém
       počítá roční součet jako kumulaci téhož, co je v měsíčním přesčasu,
       musí `dr` vyjít stejně jako `t`. Když ne, měří ty dva sloupce něco
       jiného — a je to potřeba vidět, protože na ročním součtu stojí hlídání
       zákonného stropu. */
    for (let i = 0; i < points.length; i++) {
      const prev = i > 0 ? points[i - 1].r : null
      const cur = points[i].r
      points[i].dr = (i > 0 && prev != null && cur != null) ? Math.round((cur - prev) * 100) / 100 : null
      points[i].drMatches = points[i].dr == null || points[i].t == null
        ? null
        : Math.abs(points[i].dr - points[i].t) <= 0.02
    }

    const withOt = points.filter((p) => p.t != null)
    return {
      person,
      points,
      months: withOt.length,
      total: withOt.reduce((a, p) => a + p.t, 0),
      avg: withOt.length ? withOt.reduce((a, p) => a + p.t, 0) / withOt.length : 0,
      max: withOt.length ? Math.max.apply(null, withOt.map((p) => p.t)) : 0,
      year: lastR,
    }
  }

  /** Porovnání dvou měsíců — delta na osobu i na středisko. */
  /* Který výklad sloupce „Přesčas evidence“ odpovídá mzdovému systému?
     Jsou v úvaze dva:

       A) evidence je POHYB za měsíc      → přesčas = MEZD + evidence
       B) evidence je STAV konta na konci → přesčas = MEZD + (evidence − evidence předchozího měsíce)

     Rozsoudit to umí roční součet: o kolik přibude mezi dvěma měsíci, tolik
     ten měsíc přesčasu bylo. Porovná se tedy přírůstek ročního součtu s oběma
     variantami u každého, kdo je v obou měsících. Rozdíl mezi A a B není
     kosmetický — u člověka s velkým kontem je A klidně dvojnásobek. */
  const round2 = (v) => Math.round(v * 100) / 100

  function methodCheck(movers) {
    const out = {
      checked: 0,
      okMove: 0,        // varianta A
      okBalance: 0,     // varianta B
      neither: 0,
      examples: [],
    }
    for (const m of movers) {
      if (m.r.r == null || m.prev.r == null || m.prev.e == null) continue
      out.checked++
      const dr = round2(m.r.r - m.prev.r)
      // pozor: m.r.t už může být opravené, porovnávat se musí syrový součet
      const asMove = m.r.tRaw !== undefined ? m.r.tRaw : round2(m.r.m + m.r.e)
      const asBalance = round2(m.r.m + (m.r.e - m.prev.e))
      const fitsMove = Math.abs(dr - asMove) <= 0.02
      const fitsBalance = Math.abs(dr - asBalance) <= 0.02
      if (fitsMove) out.okMove++
      if (fitsBalance) out.okBalance++
      if (!fitsMove && !fitsBalance) {
        out.neither++
        if (out.examples.length < 10) {
          out.examples.push({ row: m.r, dr, asMove, asBalance, diff: round2(dr - asMove) })
        }
      }
    }
    out.examples.sort((x, y) => Math.abs(y.diff) - Math.abs(x.diff))

    /* Vyhrává ta varianta, která sedí aspoň u 95 % lidí a zároveň výrazně líp
       než ta druhá. Když ani jedna, měří mzdový systém něco dalšího a je lepší
       to přiznat, než si vybrat. */
    const share = (n) => (out.checked ? n / out.checked : 0)
    out.verdict = !out.checked ? null
      : share(out.okBalance) >= 0.95 && out.okBalance > out.okMove ? 'balance'
      : share(out.okMove) >= 0.95 && out.okMove > out.okBalance ? 'move'
      : 'unclear'
    // zpětná kompatibilita se starou kartou
    out.mismatched = out.checked - out.okMove
    return out
  }

  PP.compare = function (current, previous) {
    if (!current || !previous) return null
    const a = PP.stats(current)
    const b = PP.stats(previous)
    const prevCenters = new Map(b.centers.map((c) => [c.name, c]))
    const centers = a.centers.map((c) => {
      const p = prevCenters.get(c.name)
      return {
        name: c.name,
        avg: c.avg,
        prevAvg: p ? p.avg : null,
        dAvg: p ? c.avg - p.avg : null,
        total: c.total,
        prevTotal: p ? p.total : null,
        dTotal: p ? c.total - p.total : null,
      }
    })
    // Osobní srovnání jde jen nad záznamy s řádky. Agregovaný měsíc (veřejné
    // vydání) lidi vůbec neobsahuje, takže zůstane u čísel za střediska.
    const rowsA = current.rows || []
    const rowsB = previous.rows || []
    const hasPeople = rowsA.length > 0 && rowsB.length > 0

    // Kdo mezi měsíci vypadl a kdo přibyl. Porovnává se podle osobního čísla,
    // ne podle klíče s pobočkou — kdo změnil středisko, není nový člověk.
    const prevIds = new Set(rowsB.map((r) => String(r.o)))
    const curIds = new Set(rowsA.map((r) => String(r.o)))
    const dropped = hasPeople
      ? rowsB.filter((r) => !curIds.has(String(r.o))).sort((x, y) => y.t - x.t)
      : []
    const added = hasPeople
      ? rowsA.filter((r) => !prevIds.has(String(r.o))).sort((x, y) => y.t - x.t)
      : []

    // kdo zůstal v obou měsících, seřazený podle změny přesčasu
    const prevById = new Map(rowsB.map((r) => [String(r.o), r]))
    const movers = hasPeople
      ? rowsA
          .filter((r) => prevById.has(String(r.o)))
          .map((r) => {
            const p = prevById.get(String(r.o))
            return { r, prev: p, d: r.t - p.t }
          })
          .sort((x, y) => y.d - x.d)
      : []

    const annual = methodCheck(movers)

    return {
      annual,
      dTotal: a.total - b.total,
      dPeople: a.withOvertime - b.withOvertime,
      dAvg: a.avg - b.avg,
      dPaidShare: a.paidShare - b.paidShare,
      centers,
      dropped,
      added,
      movers,
    }
  }
})(window.PP)
</script>

<script>
/* Veřejné vydání panelu — agregace, potlačení malých středisek a sestavení
 * souboru pro GitHub Pages.
 *
 * Běží v prohlížeči, protože tam už data jsou. Milan tak nepotřebuje Node ani
 * Playwright: naimportuje výkazy do panelu, klikne na Vygenerovat a dostane
 * hotový index.html, který jen nahraje do repozitáře.
 *
 * Tentýž kód používá i tools/build-public.mjs, aby existovala jedna jediná
 * definice toho, co se zveřejňuje. Kdyby se rozešly, lišila by se webová
 * verze od té z příkazové řádky a nikdo by nevěděl, která platí.
 */
window.PP = window.PP || {}

;(function (PP) {
  'use strict'

  /** Pod tolik lidí se středisko nezveřejňuje samostatně. */
  const MIN_PEOPLE = 5

  const HIST = [
    { to: 0, label: '≤ 0' }, { from: 0, to: 10, label: '0–10' },
    { from: 10, to: 20, label: '10–20' }, { from: 20, to: 30, label: '20–30' },
    { from: 30, to: 40, label: '30–40' }, { from: 40, to: 50, label: '40–50' },
    { from: 50, to: 60, label: '50–60' }, { from: 60, to: Infinity, label: '60+' },
  ]

  const round2 = (v) => Math.round(v * 100) / 100

  const stredisek = (n) => (n === 1 ? 'středisko' : n < 5 ? 'střediska' : 'středisek')

  /**
   * Z měsíců s řádky lidí udělá měsíce se samými souhrny.
   * @returns {{months: object, suppressed: number, log: string[]}}
   */
  PP.publicMonths = function (months, CFG) {
    const out = {}
    const log = []
    let suppressed = 0

    for (const key of Object.keys(months).sort()) {
      const rec = months[key]
      const rows = rec.rows || []

      const byCenter = new Map()
      for (const r of rows) {
        let c = byCenter.get(r.s)
        if (!c) { c = { name: r.s, people: 0, total: 0, m: 0, e: 0 }; byCenter.set(r.s, c) }
        c.people++; c.total += r.t; c.m += r.m; c.e += r.t - r.m
      }

      // Malá střediska se slučují. U tříčlenného by průměr na osobu prakticky
      // prozradil přesčasy těch tří lidí — každý ví, kdo tam pracuje.
      const big = []
      const small = { name: 'Ostatní (malá střediska)', people: 0, total: 0, m: 0, e: 0 }
      let smallCount = 0
      for (const c of byCenter.values()) {
        if (c.people >= MIN_PEOPLE) big.push(c)
        else {
          small.people += c.people; small.total += c.total; small.m += c.m; small.e += c.e
          smallCount++
        }
      }

      const centers = big.map((c) => ({
        name: c.name, people: c.people,
        total: round2(c.total), m: round2(c.m), e: round2(c.e),
      }))
      // Sloučený zbytek může být sám příliš malý — pak se nezveřejní vůbec.
      if (small.people >= MIN_PEOPLE) {
        centers.push({
          name: small.name, people: small.people,
          total: round2(small.total), m: round2(small.m), e: round2(small.e),
        })
      } else if (smallCount) {
        suppressed += small.people
      }

      out[key] = {
        period: rec.period,
        rawPeriod: rec.rawPeriod,
        people: rec.people,
        aggregate: true,
        /* Podle čeho se čísla spočítala. Bez toho by veřejná stránka nemohla
           říct, proč nesedí na sestavu z mezd — sama to změřit nemůže, protože
           řádky s lidmi v ní nejsou. */
        method: (PP.data && PP.data.method) || undefined,
        methodIncomplete: rec.methodIncomplete || undefined,
        // ať je i na zveřejněné stránce poznat, že jde o vzorek, ne o závod
        demo: rec.demo || undefined,
        summary: {
          withOvertime: rows.length,
          total: round2(rows.reduce((a, r) => a + r.t, 0)),
          mezdy: round2(rows.reduce((a, r) => a + r.m, 0)),
          // zbytek do celku, ne syrový sloupec evidence — viz js/data.js
          evidence: round2(rows.reduce((a, r) => a + (r.t - r.m), 0)),
          overWarn: rows.filter((r) => r.t >= CFG.person.warn).length,
          overCrit: rows.filter((r) => r.t >= CFG.person.crit).length,
          year150: rows.filter((r) => r.r > CFG.year.warn).length,
          year250: rows.filter((r) => r.r > CFG.year.crit).length,
          yearCap: rows.filter((r) => r.r >= CFG.year.cap).length,
          hist: HIST.map((b) => ({
            label: b.label,
            count: rows.filter((r) => (b.to === 0 ? r.t <= 0 : r.t > b.from && r.t <= b.to)).length,
          })),
          centers,
        },
      }

      const label = PP.monthName ? PP.monthName(key) : key
      log.push(`${label}: ${centers.length} ${stredisek(centers.length)} zveřejněno` +
        (smallCount ? ` · ${smallCount} malých sloučeno` : ''))
    }

    return { months: out, suppressed, log }
  }

  /**
   * Poslední pojistka před zápisem: projde hotový text a hledá v něm jakékoli
   * jméno nebo osobní číslo ze zdrojových dat. Když něco najde, soubor se
   * nesmí vydat — ať už to tam přiteklo odkudkoli.
   */
  PP.publicLeaks = function (text, months) {
    const needles = new Set()
    for (const rec of Object.values(months)) {
      for (const r of rec.rows || []) { needles.add(String(r.n)); needles.add(String(r.o)) }
    }
    return [...needles].filter((n) => n && text.includes(n))
  }

  /* ---------- sestavení souboru v prohlížeči ---------- */

  const safe = (code) => code.replace(/<\/(script)/gi, '<\\/$1')

  /** Stáhne a vloží do dokumentu styly a skripty, které jsou zatím odkazem. */
  async function inlineAssets(doc) {
    const local = (url) => {
      try { return new URL(url, location.href).origin === location.origin } catch (e) { return false }
    }

    for (const link of [...doc.querySelectorAll('link[rel="stylesheet"][href]')]) {
      const href = link.getAttribute('href')
      if (!local(href)) continue           // Google Fonts zůstávají odkazem
      const css = await (await fetch(href)).text()
      const style = doc.createElement('style')
      style.textContent = css.trimEnd()
      link.replaceWith(style)
    }

    for (const script of [...doc.querySelectorAll('script[src]')]) {
      const src = script.getAttribute('src')
      if (!local(src)) continue
      const code = await (await fetch(src)).text()
      const inlineScript = doc.createElement('script')
      if (script.id) inlineScript.id = script.id
      inlineScript.textContent = '\n' + safe(code.trimEnd()) + '\n'
      script.replaceWith(inlineScript)
    }
  }

  /**
   * Postaví veřejnou verzi z právě běžícího panelu.
   * @param {object} months  měsíce s řádky lidí (PP.data)
   * @returns {Promise<{html: string, months: object, suppressed: number, log: string[]}>}
   */
  PP.buildPublicHtml = async function (months) {
    if (!Object.keys(months).length) throw new Error('Nejsou naimportované žádné měsíce.')

    const agg = PP.publicMonths(months, PP.CFG)

    // Vychází se z živé stránky, ale všechno vykreslené se vyhodí. Právě
    // v panelech jsou jména — kdyby tam zbyla, odnesl by si je výstup.
    const doc = document.implementation.createHTMLDocument('')
    doc.replaceChild(doc.importNode(document.documentElement, true), doc.documentElement)
    doc.documentElement.setAttribute('data-theme', '')
    for (const el of doc.querySelectorAll('.panel, #nav, #month-select, #demo-banner, #rail-note, #export-status')) {
      el.innerHTML = ''
    }

    await inlineAssets(doc)

    const data = doc.querySelector('#pp-data')
    if (!data) throw new Error('V dokumentu chybí skript s daty (#pp-data).')
    const serialized = JSON.stringify(agg.months)
    data.removeAttribute('src')
    data.textContent = '\nwindow.PP_PUBLIC = true;\nwindow.PP_BUILTIN_MONTHS = ' + safe(serialized) + ';\n'

    const head = doc.querySelector('head')
    const robots = doc.createElement('meta')
    robots.setAttribute('name', 'robots')
    robots.setAttribute('content', 'noindex')
    head.appendChild(robots)
    const gen = doc.createElement('meta')
    gen.setAttribute('name', 'generator')
    gen.setAttribute('content', 'panel · ' + new Date().toISOString().slice(0, 10))
    head.appendChild(gen)

    const html = '<!doctype html>\n' + doc.documentElement.outerHTML + '\n'

    const leaked = PP.publicLeaks(html, months)
    if (leaked.length) {
      throw new Error('Ve výstupu se objevilo ' + leaked.length +
        ' jmen nebo osobních čísel — soubor se nevydal. Nahlas to, je to chyba panelu.')
    }

    return { html, months: agg.months, suppressed: agg.suppressed, log: agg.log }
  }

  PP.PUBLIC_MIN_PEOPLE = MIN_PEOPLE
})(window.PP)
</script>

<script>
/* Živé sdílení souhrnů přes Firebase Realtime Database.
 *
 * Co jde ven: VÝHRADNĚ agregáty za střediska z js/public.js. Jména ani osobní
 * čísla databázi nikdy neuvidí — zůstávají v prohlížeči toho, kdo importuje.
 * Zápis prochází touž kontrolou úniku jako stahovaný soubor; kdyby se v datech
 * objevilo jediné jméno, neodešle se nic.
 *
 * Kdo smí co:
 *   • čtení  — kdokoli přihlášený, i anonymně (souhrny nejsou osobní údaj)
 *   • zápis  — jen účet uvedený v pravidlech databáze, přes e-mail a heslo
 * Pravidla jsou v database.rules.json a vynucuje je server, ne tahle stránka.
 *
 * Konfigurace se doplňuje do window.PP_FIREBASE (viz README). Dokud tam není,
 * je celá vrstva vypnutá a panel se chová jako dřív — jen s localStorage.
 */
window.PP = window.PP || {}

;(function (PP) {
  'use strict'

  /* Kam se v databázi zapisuje. Verze v cestě je tu proto, aby se dal formát
     později změnit, aniž by staré stránky četly něco, čemu nerozumí. */
  const PATH = 'prescasy/v1/public'

  /* Firebase SDK se stahuje až při prvním použití. Zkouší se postupně —
     kdyby jedna adresa nebyla dostupná, jede se na další. Vlastní verzi lze
     vynutit přes window.PP_FIREBASE.sdk. */
  const SDK_BASES = [
    'https://www.gstatic.com/firebasejs/10.12.2',
    'https://www.gstatic.com/firebasejs/9.23.0',
  ]
  const SDK_PARTS = ['firebase-app-compat.js', 'firebase-auth-compat.js', 'firebase-database-compat.js']

  const cfg = () => window.PP_FIREBASE || null

  function loadScript(url) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script')
      s.src = url
      s.onload = resolve
      s.onerror = () => reject(new Error('Nenačetl se ' + url))
      document.head.appendChild(s)
    })
  }

  let sdkPromise = null
  function loadSdk() {
    if (window.firebase && window.firebase.database) return Promise.resolve(window.firebase)
    if (sdkPromise) return sdkPromise
    const bases = cfg() && cfg().sdk ? [cfg().sdk] : SDK_BASES
    sdkPromise = (async () => {
      let last = null
      for (const base of bases) {
        try {
          for (const part of SDK_PARTS) await loadScript(base + '/' + part)
          if (window.firebase && window.firebase.database) return window.firebase
          last = new Error('SDK se načetlo, ale firebase.database chybí.')
        } catch (err) { last = err }
      }
      sdkPromise = null
      throw new Error('Nepodařilo se načíst Firebase SDK. ' +
        (last ? last.message + ' ' : '') +
        'Zkontrolujte připojení, nebo doplňte do konfigurace vlastní adresu (sdk).')
    })()
    return sdkPromise
  }

  let app = null
  async function fb() {
    const c = cfg()
    if (!c || !c.databaseURL || /__FIREBASE/.test(JSON.stringify(c))) {
      throw new Error('Firebase není nastavený — v panelu chybí window.PP_FIREBASE (viz README).')
    }
    const firebase = await loadSdk()
    if (!app) app = firebase.apps.length ? firebase.apps[0] : firebase.initializeApp(c)
    return firebase
  }

  /* ---------- veřejné rozhraní ---------- */

  const impl = {
    name: 'Firebase RTDB',

    /** Je vůbec kam se připojovat? */
    configured() {
      const c = cfg()
      return !!(c && c.databaseURL && !/__FIREBASE/.test(JSON.stringify(c)))
    },

    /** Přihlásí se anonymně — potřeba i na pouhé čtení, pravidla to vyžadují. */
    async connect() {
      const firebase = await fb()
      if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously()
      return true
    },

    /** Přihlášení účtem, který smí zapisovat. */
    async signIn(email, password) {
      const firebase = await fb()
      const res = await firebase.auth().signInWithEmailAndPassword(email, password)
      return { email: res.user.email, uid: res.user.uid }
    },

    async signOut() {
      const firebase = await fb()
      await firebase.auth().signOut()
    },

    /** Kdo je právě přihlášený; anonymní účet se nepočítá. */
    async currentUser() {
      const firebase = await fb()
      const u = firebase.auth().currentUser
      return u && !u.isAnonymous ? { email: u.email, uid: u.uid } : null
    },

    /** Jednorázové načtení zveřejněných souhrnů. */
    async load() {
      const firebase = await fb()
      await this.connect()
      const snap = await firebase.database().ref(PATH).get()
      return snap.exists() ? snap.val() : null
    },

    /** Živé sledování — zavolá cb při každé změně. Vrací funkci pro odhlášení. */
    async watch(cb) {
      const firebase = await fb()
      await this.connect()
      const ref = firebase.database().ref(PATH)
      const handler = ref.on('value', (snap) => cb(snap.exists() ? snap.val() : null))
      return () => ref.off('value', handler)
    },

    /** Zápis souhrnů. Jedním update(), ať je stránka buď celá stará, nebo celá nová. */
    async publish(payload) {
      const firebase = await fb()
      await firebase.database().ref(PATH).set(payload)
    },
  }

  /* Testy a jiná úložiště si mohou podstrčit vlastní implementaci. */
  function backend() { return window.PP_REMOTE_ADAPTER || impl }

  PP.remote = {
    get name() { return backend().name },
    configured() { return backend().configured() },
    connect() { return backend().connect() },
    signIn(email, password) { return backend().signIn(email, password) },
    signOut() { return backend().signOut() },
    currentUser() { return backend().currentUser() },
    load() { return backend().load() },
    watch(cb) { return backend().watch(cb) },

    /**
     * Spočítá souhrny a zveřejní je. Před odesláním projde výsledek touž
     * kontrolou jako stahovaný soubor — kdyby se do agregátů jakkoli dostalo
     * jméno nebo osobní číslo, neodešle se vůbec nic.
     */
    async publishMonths(months) {
      if (!Object.keys(months).length) throw new Error('Nejsou naimportované žádné měsíce.')

      /* Ukázkové měsíce do sdílené databáze nepatří. Soubor ke stažení je smí
         obsahovat — slouží jako ukázka, než se naimportuje první výkaz — ale
         tohle je ostrý provoz a kolegové by vymyšlená čísla nepoznali. */
      const real = {}
      for (const k of Object.keys(months)) if (!months[k].demo) real[k] = months[k]
      if (!Object.keys(real).length) {
        throw new Error('Jsou načtené jen ukázkové měsíce — není co zveřejnit. Naimportujte výkaz.')
      }

      const agg = PP.publicMonths(real, PP.CFG)

      /* Projít JSONem: Firebase na hodnotě undefined zápis odmítne a agregáty
         jich pár obsahují (třeba `demo` u neukázkových měsíců). Zároveň tím
         je jisté, že se odešle přesně to, co projde kontrolou níž. */
      const payload = JSON.parse(JSON.stringify({
        months: agg.months,
        updatedAt: new Date().toISOString(),
      }))
      const leaked = PP.publicLeaks(JSON.stringify(payload), real)
      if (leaked.length) {
        throw new Error('V souhrnech se objevilo ' + leaked.length +
          ' jmen nebo osobních čísel — neodeslalo se nic. Nahlas to, je to chyba panelu.')
      }

      await backend().publish(payload)
      return { months: agg.months, suppressed: agg.suppressed, log: agg.log, updatedAt: payload.updatedAt }
    },
  }
})(window.PP)
</script>

;(function (PP) {
  'use strict'

  const { esc, hm, h1, num, pct, fold, mark, level, monthName, monthShort, centerName, $, $$ } = PP
  const CFG = PP.CFG
